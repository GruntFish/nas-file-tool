<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📂 文件工具箱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:100%;max-width:1600px;height:95vh;background:#1a1d27;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.header{padding:10px 20px;background:#222632;border-bottom:1px solid #2d313e;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.header h1{font-size:15px;color:#e4e6eb;display:flex;align-items:center;gap:10px}
.header h1 span{background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions .badge{color:#8b8fa3;font-size:11px;background:#2d313e;padding:4px 14px;border-radius:20px}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:280px;min-width:200px;background:#14171f;border-right:1px solid #2d313e;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-header{padding:8px 14px;background:#1a1d27;border-bottom:1px solid #2d313e;font-size:11px;color:#8b8fa3;text-transform:uppercase;letter-spacing:1px;font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.sidebar-header .refresh-btn{background:0;border:0;color:#667eea;cursor:pointer;font-size:14px;padding:2px 8px;border-radius:4px}
.sidebar-header .refresh-btn:hover{background:#2d313e}
.tree-container{flex:1;overflow-y:auto;padding:4px 0}
.tree-container::-webkit-scrollbar{width:4px}
.tree-container::-webkit-scrollbar-track{background:#14171f}
.tree-container::-webkit-scrollbar-thumb{background:#2d313e;border-radius:4px}
.tree-item{display:flex;align-items:center;padding:3px 12px 3px 8px;cursor:pointer;color:#b5b9c9;font-size:13px;border-radius:4px;margin:1px 6px;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.tree-item:hover{background:#2d313e;color:#e4e6eb}
.tree-item.active{background:#2d3b6e;color:#e4e6eb}
.tree-item .icon{margin-right:6px;font-size:14px;flex-shrink:0;width:20px;text-align:center}
.tree-item .name{overflow:hidden;text-overflow:ellipsis}
.tree-item .arrow{margin-left:auto;font-size:11px;color:#6b6f83;transition:transform .2s;flex-shrink:0;cursor:pointer;padding:0 4px}
.tree-item .arrow.open{transform:rotate(90deg)}
.tree-children{padding-left:16px;overflow:hidden}
.tree-children.collapsed{display:none}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.path-bar{padding:4px 14px;background:#1a1d27;border-bottom:1px solid #2d313e;display:flex;align-items:center;flex-shrink:0;min-height:32px}
.path-bar .path-display{color:#8b8fa3;font-size:12px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path-bar .path-display strong{color:#e4e6eb}
.rename-bar{padding:3px 14px;background:#14171f;border-bottom:1px solid #2d313e;display:flex;flex-wrap:wrap;gap:3px 5px;align-items:center;flex-shrink:0;min-height:30px}
.rename-bar select,.rename-bar input{background:#1a1d27;border:1px solid #2d313e;border-radius:4px;color:#e4e6eb;padding:2px 6px;font-size:12px;outline:0;font-family:inherit;height:24px}
.rename-bar select:focus,.rename-bar input:focus{border-color:#667eea}
.rename-bar input[type=text]{min-width:120px;flex:1}
.rename-bar input[type=number]{width:42px}
.rename-bar .label{color:#8b8fa3;font-size:11px;font-weight:600;white-space:nowrap}
.rename-bar .checkbox-label{color:#8b8fa3;font-size:11px;display:flex;align-items:center;gap:3px}
.rename-bar .checkbox-label input[type=checkbox]{accent-color:#667eea;width:12px;height:12px;margin:0}
.rename-bar .btn-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rename-bar .btn-group .sep{color:#2d313e;font-size:14px;padding:0 4px;user-select:none}
.rename-bar .btn-group .btn-spacer{width:16px;flex-shrink:0}
.rename-bar button{background:#2d313e;border:0;color:#b5b9c9;padding:2px 12px;border-radius:4px;font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap;height:24px}
.rename-bar button:hover:not(:disabled){background:#3d4150;color:#e4e6eb}
.rename-bar button.primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.rename-bar button.primary:hover:not(:disabled){opacity:.85}
.rename-bar button.danger{background:#e53e3e;color:#fff}
.rename-bar button.danger:hover:not(:disabled){opacity:.85}
.rename-bar button.undo-btn{background:#f6ad55;color:#1a1d27}
.rename-bar button.undo-btn:hover:not(:disabled){background:#ed8936}
.rename-bar button:disabled{opacity:.4;cursor:not-allowed}
.rename-bar .btn-execute{background:linear-gradient(135deg,#667eea,#764ba2);border:0;color:#fff;padding:2px 14px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;height:24px}
.rename-bar .btn-execute:hover:not(:disabled){opacity:.85}
.file-list-container{flex:1;overflow:auto;padding:0}
.file-list-container::-webkit-scrollbar{width:6px;height:6px}
.file-list-container::-webkit-scrollbar-track{background:#14171f}
.file-list-container::-webkit-scrollbar-thumb{background:#2d313e;border-radius:4px}
.file-table{width:100%;border-collapse:collapse;font-size:13px}
.file-table thead{position:sticky;top:0;z-index:10}
.file-table th{text-align:left;padding:5px 10px;color:#8b8fa3;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #2d313e;background:#1a1d27}
.file-table td{padding:4px 10px;color:#b5b9c9;border-bottom:1px solid #1f222c;font-size:12px}
.file-table tr:hover td{background:#222632}
.file-table tr.selected td{background:#2d3b6e}
.file-table .checkbox-col{width:28px;text-align:center}
.file-table .checkbox-col input[type=checkbox]{accent-color:#667eea;width:14px;height:14px;cursor:pointer}
.file-table .name-col{font-weight:500}
.file-table .new-name-col{color:#68d391;font-weight:500}
.file-table .new-name-col.unchanged{color:#4a4e62;font-weight:400}
.file-table .size-col{color:#6b6f83;font-size:11px}
.file-table .date-col{color:#6b6f83;font-size:11px}
.file-table .status-col{font-size:11px}
.file-table .status-col.changed{color:#f0c94d}
.file-table .status-col.ok{color:#68d391}
.file-table .folder-row .name-col{color:#f0c94d}
.file-table .empty-row td{padding:40px;text-align:center;color:#4a4e62;font-size:14px}
.status-bar{padding:3px 16px;background:#14171f;border-top:1px solid #2d313e;display:flex;justify-content:space-between;font-size:11px;color:#4a4e62;flex-shrink:0}
.log-area{max-height:60px;overflow-y:auto;background:#14171f;border-top:1px solid #2d313e;padding:3px 16px;font-family:'Courier New',monospace;font-size:11px;line-height:1.4;display:none;flex-shrink:0}
.log-area.show{display:block}
.log-area .log-line{color:#8b8fa3;padding:1px 0}
.log-area .log-line.success{color:#68d391}
.log-area .log-line.error{color:#fc8181}
.log-area .log-line.info{color:#63b3ed}
.log-area::-webkit-scrollbar{width:4px}
.log-area::-webkit-scrollbar-track{background:#14171f}
.log-area::-webkit-scrollbar-thumb{background:#2d313e;border-radius:4px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:#1a1d27;border-radius:12px;padding:20px 24px;max-width:650px;width:92%;max-height:85vh;overflow-y:auto;border:1px solid #2d313e;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
.modal h2{color:#e4e6eb;font-size:17px;margin-bottom:12px}
.modal h3{color:#8b8fa3;font-size:13px;margin:10px 0 6px}
.modal hr{border:0;border-top:1px solid #2d313e;margin:10px 0}
.modal .form-group{margin-bottom:8px}
.modal .form-group label{display:block;color:#8b8fa3;font-size:12px;font-weight:600;margin-bottom:2px}
.modal .form-group select,.modal .form-group input{width:100%;padding:5px 8px;background:#14171f;border:1px solid #2d313e;border-radius:6px;color:#e4e6eb;font-size:13px;outline:0;font-family:inherit}
.modal .form-group select:focus,.modal .form-group input:focus{border-color:#667eea}
.modal .form-group input[type=checkbox]{width:auto;accent-color:#667eea}
.modal .filter-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.modal .filter-grid .form-group{margin-bottom:0}
.modal .filter-grid .form-group label{font-size:11px}
.modal .filter-grid .form-group select,.modal .filter-grid .form-group input{padding:4px 6px;font-size:12px}
.modal .filter-grid .full-width{grid-column:1 / -1}
.modal .filter-grid .full-width input{width:100%}
.modal .btn-row{display:flex;gap:10px;margin-top:14px}
.modal .btn-row button{flex:1;padding:8px;border:0;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.modal .btn-row .btn-confirm{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.modal .btn-row .btn-confirm:hover{opacity:.85}
.modal .btn-row .btn-cancel{background:#2d313e;color:#b5b9c9}
.modal .btn-row .btn-cancel:hover{background:#3d4150}
.modal .preview-info{background:#14171f;border-radius:6px;padding:6px 10px;margin:4px 0;font-size:12px;color:#b5b9c9}
.modal .preview-info .matched{color:#68d391}
.modal .preview-info .total{color:#8b8fa3}
.modal .preview-list{max-height:120px;overflow-y:auto;background:#14171f;border-radius:6px;padding:4px 8px;margin:4px 0;font-size:12px;font-family:monospace;color:#b5b9c9}
.modal .preview-list .changed{color:#68d391}
@media(max-width:768px){.sidebar{width:180px;min-width:120px}.container{height:98vh;border-radius:0}.file-table{font-size:11px}.file-table th,.file-table td{padding:4px 6px}.modal{max-width:95%;padding:16px}.modal .filter-grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.sidebar{display:none}.file-table .date-col{display:none}.file-table .size-col{display:none}.modal .filter-grid{grid-template-columns:1fr}}
.loading-spinner{display:inline-block;width:14px;height:14px;border:2px solid #2d313e;border-top:2px solid #667eea;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📂 <span>文件工具箱</span></h1>
        <div class="header-actions"><span class="badge">🔄 本地处理 · 隐私安全</span></div>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="sidebar-header">
                📁 目录树
                <button class="refresh-btn" id="refreshTreeBtn">⟳</button>
            </div>
            <div class="tree-container" id="treeContainer">
                <div style="padding:20px;text-align:center;color:#4a4e62;font-size:13px;">
                    <span class="loading-spinner"></span> 加载中...
                </div>
            </div>
        </div>
        <div class="content">
            <div class="path-bar">
                <div class="path-display">
                    📂 <strong id="currentPathDisplay">/</strong>
                    <span id="fileCountDisplay" style="margin-left:12px;color:#4a4e62;">0 项</span>
                    <span id="selectedInfo" style="margin-left:12px;color:#667eea;"></span>
                </div>
                <div style="display:flex;gap:6px;">
                    <button id="selectAllBtn" style="background:#2d313e;border:0;color:#b5b9c9;padding:2px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;height:22px;">全选</button>
                    <button id="clearAllBtn" style="background:#2d313e;border:0;color:#b5b9c9;padding:2px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;height:22px;">取消</button>
                </div>
            </div>

            <div class="rename-bar" id="renameBar">
                <span class="label">操作</span>
                <select id="renameAction">
                    <option value="replace">替换</option>
                    <option value="regex">正则替换</option>
                    <option value="prefix">添加前缀</option>
                    <option value="suffix">添加后缀</option>
                    <option value="number">编号</option>
                    <option value="lowercase">转小写</option>
                    <option value="uppercase">转大写</option>
                    <option value="capitalize">首字母大写</option>
                    <option value="titlecase">标题大小写</option>
                    <option value="camelcase">驼峰式</option>
                    <option value="extension">扩展名</option>
                    <option value="remove">删除字符</option>
                    <option value="removepos">按位置删除</option>
                    <option value="date">添加日期</option>
                </select>

                <span id="findLabel" class="label">查找</span>
                <input type="text" id="findText" placeholder="查找" style="min-width:180px;flex:1">
                <span id="replaceLabel" class="label">替换为</span>
                <input type="text" id="replaceText" placeholder="替换为" style="min-width:180px;flex:1">
                <label class="checkbox-label"><input type="checkbox" id="caseSensitive"> 大小写敏感</label>

                <span id="numParams" style="display:none;">
                    <span class="label">起始</span>
                    <input type="number" id="startNum" value="1">
                    <span class="label">步长</span>
                    <input type="number" id="stepNum" value="1">
                    <span class="label">位数</span>
                    <input type="number" id="digitsNum" value="2">
                    <span class="label">位置</span>
                    <select id="numberPos"><option value="suffix">后缀</option><option value="prefix">前缀</option></select>
                </span>

                <span id="extParams" style="display:none;">
                    <select id="extAction"><option value="change">更改</option><option value="add">添加</option><option value="remove">删除</option><option value="replace">替换</option></select>
                    <input type="text" id="extValue" placeholder="新扩展名">
                </span>

                <span id="removePosParams" style="display:none;">
                    <span class="label">起始</span>
                    <input type="number" id="removeStart" value="1">
                    <span class="label">长度</span>
                    <input type="number" id="removeLen" value="1">
                    <label class="checkbox-label"><input type="checkbox" id="removeFromEnd"> 从末尾</label>
                </span>

                <span id="dateParams" style="display:none;">
                    <select id="dateType"><option value="created">创建日期</option><option value="modified">修改日期</option><option value="custom">自定义</option></select>
                    <select id="dateFormat"><option value="YYYY-MM-DD">2024-01-15</option><option value="YYYYMMDD">20240115</option><option value="YYMMDD">240115</option></select>
                    <select id="datePos"><option value="prefix">前缀</option><option value="suffix">后缀</option></select>
                </span>

                <div class="btn-group">
                    <button class="btn-execute" id="executeRenameBtn">✅ 执行重命名</button>
                    <span class="sep">|</span>
                    <button id="moveCopyBtn" class="primary">📦 移动/复制</button>
                    <span class="btn-spacer"></span>
                    <button id="dedupBtn" class="primary">🧹 去重</button>
                    <span class="btn-spacer"></span>
                    <button id="deleteBtn" class="danger">🗑️ 删除</button>
                    <span class="btn-spacer"></span>
                    <button id="undoBtn" class="undo-btn" disabled>↩ 撤销</button>
                </div>
            </div>

            <div class="file-list-container" id="fileListContainer">
                <table class="file-table">
                    <thead><tr>
                        <th class="checkbox-col"><input type="checkbox" id="selectAll"></th>
                        <th class="name-col">名称</th>
                        <th class="new-name-col">新名称</th>
                        <th class="size-col">大小</th>
                        <th class="date-col">修改时间</th>
                        <th class="status-col">状态</th>
                    </tr></thead>
                    <tbody id="fileTableBody">
                        <tr class="empty-row"><td colspan="6">📭 此目录为空</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="log-area" id="logArea"></div>
        </div>
    </div>
    <div class="status-bar">
        <span id="statusLeft">就绪</span>
        <span id="statusRight">ghcr.io/gruntfish/nas-file-tool</span>
    </div>
</div>

<!-- 移动/复制模态框 -->
<div class="modal-overlay" id="moveCopyModal">
    <div class="modal">
        <h2>📦 移动/复制文件</h2>
        <div style="color:#8b8fa3;font-size:13px;margin-bottom:10px;">
            源目录：<strong id="moveSourcePath" style="color:#e4e6eb;">/</strong>
            <span style="color:#4a4e62;margin-left:8px;" id="moveFileCount">（请设置过滤条件）</span>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div class="form-group">
                <label>操作</label>
                <select id="moveCopyAction">
                    <option value="move">移动</option>
                    <option value="copy">复制</option>
                </select>
            </div>
            <div class="form-group">
                <label>覆盖已存在文件</label>
                <div style="display:flex;align-items:center;height:32px;padding-left:4px;">
                    <input type="checkbox" id="moveOverwrite">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>目标目录</label>
            <div style="display:flex;gap:6px;">
                <select id="moveTargetSelect" style="flex:2;min-width:120px;">
                    <option value="">📁 选择已有目录...</option>
                </select>
                <input type="text" id="moveTargetInput" placeholder="输入新目录名自动创建" style="flex:1;min-width:100px;">
            </div>
            <div style="color:#4a4e62;font-size:11px;margin-top:2px;">
                💡 下拉框选择已有目录，或输入新目录名称（自动创建）
            </div>
        </div>

        <hr>
        <h3>📋 过滤条件（必填，至少填写一项）</h3>

        <div class="filter-grid">
            <div class="form-group"><label>文件名包含</label><input type="text" id="filterNameContains" placeholder="IMG_"></div>
            <div class="form-group"><label>文件名不包含</label><input type="text" id="filterNameNotContains" placeholder="temp"></div>
            <div class="form-group"><label>扩展名</label><input type="text" id="filterExtensions" placeholder=".jpg,.png"></div>
            <div class="form-group"><label>排除扩展名</label><input type="text" id="filterExtNot" placeholder=".tmp"></div>
            <div class="form-group"><label>最小大小(KB)</label><input type="number" id="filterMinSize" placeholder="1024"></div>
            <div class="form-group"><label>最大大小(KB)</label><input type="number" id="filterMaxSize" placeholder="10240"></div>
            <div class="form-group"><label>日期(晚于)</label><input type="date" id="filterDateAfter"></div>
            <div class="form-group"><label>日期(早于)</label><input type="date" id="filterDateBefore"></div>
            <div class="form-group"><label>文件类型</label>
                <select id="filterFileTypes">
                    <option value="">全部</option>
                    <option value="image">图片</option>
                    <option value="video">视频</option>
                    <option value="audio">音频</option>
                    <option value="document">文档</option>
                    <option value="archive">压缩包</option>
                </select>
            </div>
            <div class="form-group full-width"><label>正则匹配</label><input type="text" id="filterRegex" placeholder="^IMG_.*\.jpg$"></div>
        </div>

        <div id="filterPreview" style="display:none;margin-top:6px;">
            <div class="preview-info" id="filterPreviewInfo"></div>
        </div>

        <div class="btn-row">
            <button class="btn-cancel" onclick="closeModal('moveCopyModal')">取消</button>
            <button class="btn-confirm" id="moveCopyConfirmBtn">确认执行</button>
        </div>
    </div>
</div>

<!-- 删除模态框 -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal">
        <h2>🗑️ 删除文件/目录</h2>
        <div style="color:#e53e3e;font-size:13px;margin-bottom:10px;">
            ⚠️ 警告：删除操作不可恢复！
        </div>
        <div style="color:#8b8fa3;font-size:13px;margin-bottom:10px;">
            源目录：<strong id="deleteSourcePath" style="color:#e4e6eb;">/</strong>
            <span style="color:#4a4e62;margin-left:8px;" id="deleteFileCount">（请设置过滤条件）</span>
        </div>

        <hr>
        <h3>📋 过滤条件（必填，至少填写一项）</h3>

        <div class="filter-grid">
            <div class="form-group"><label>文件名包含</label><input type="text" id="delFilterNameContains" placeholder="IMG_"></div>
            <div class="form-group"><label>文件名不包含</label><input type="text" id="delFilterNameNotContains" placeholder="temp"></div>
            <div class="form-group"><label>扩展名</label><input type="text" id="delFilterExtensions" placeholder=".jpg,.png"></div>
            <div class="form-group"><label>排除扩展名</label><input type="text" id="delFilterExtNot" placeholder=".tmp"></div>
            <div class="form-group"><label>最小大小(KB)</label><input type="number" id="delFilterMinSize" placeholder="1024"></div>
            <div class="form-group"><label>最大大小(KB)</label><input type="number" id="delFilterMaxSize" placeholder="10240"></div>

<script>
let currentPath = '/';
let fileList = [];
let renamePreview = {};
let renameHistory = [];
let fullTreeData = [];
let selectedFiles = new Set();

const treeContainer = document.getElementById('treeContainer');
const fileTableBody = document.getElementById('fileTableBody');
const currentPathDisplay = document.getElementById('currentPathDisplay');
const fileCountDisplay = document.getElementById('fileCountDisplay');
const selectedInfo = document.getElementById('selectedInfo');
const statusLeft = document.getElementById('statusLeft');
const logArea = document.getElementById('logArea');

function getFileName(filePath) {
    if (!filePath) return '';
    const parts = filePath.split('/');
    return parts[parts.length - 1];
}

function getFileExtension(fileName) {
    const idx = fileName.lastIndexOf('.');
    if (idx > 0) return fileName.substring(idx);
    return '';
}

function getFileNameWithoutExt(fileName) {
    const idx = fileName.lastIndexOf('.');
    if (idx > 0) return fileName.substring(0, idx);
    return fileName;
}

async function apiCall(endpoint, data) {
    const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    return res.json();
}

async function fetchTree(path) { return apiCall('/api/tree', { path }); }
async function fetchFiles(path) { return apiCall('/api/files', { path }); }
async function undoRename() { return apiCall('/api/undo', {}); }
async function dedupFiles(data) { return apiCall('/api/dedup', data); }

function collectSubdirs(nodes, prefix) {
    let result = [];
    for (let node of nodes) {
        if (node.is_dir) {
            const fullPath = prefix ? prefix + '/' + node.name : node.name;
            result.push(fullPath);
            if (node.children && node.children.length > 0) {
                result = result.concat(collectSubdirs(node.children, fullPath));
            }
        }
    }
    return result;
}

function updateTargetSelect() {
    const select = document.getElementById('moveTargetSelect');
    const currentValue = select.value;
    select.innerHTML = '<option value="">📁 选择已有目录...</option>';
    const subdirs = collectSubdirs(fullTreeData, '');
    subdirs.sort();
    for (let dir of subdirs) {
        const opt = document.createElement('option');
        opt.value = dir;
        opt.textContent = '📁 ' + dir;
        select.appendChild(opt);
    }
    if (currentValue && subdirs.includes(currentValue)) {
        select.value = currentValue;
    }
}

function renderTree(nodes, container) {
    container.innerHTML = '';
    if (!nodes || nodes.length === 0) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:#4a4e62;font-size:13px;">📭 没有子目录</div>';
        return;
    }
    const folders = nodes.filter(n => n.is_dir);
    if (folders.length === 0) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:#4a4e62;font-size:13px;">📭 没有子目录</div>';
        return;
    }
    folders.sort((a, b) => a.name.localeCompare(b.name));
    folders.forEach(node => {
        const item = document.createElement('div');
        item.className = 'tree-item';
        if (node.path === currentPath) item.classList.add('active');
        const hasChildren = node.children && node.children.length > 0;
        item.innerHTML = '<span class="icon">📁</span><span class="name">' + escapeHtml(node.name) + '</span>' + (hasChildren ? '<span class="arrow open">▼</span>' : '');
        item.addEventListener('click', function(e) {
            if (e.target.classList.contains('arrow')) return;
            navigateTo(node.path);
        });
        container.appendChild(item);
        if (hasChildren) {
            const childContainer = document.createElement('div');
            childContainer.className = 'tree-children';
            if (currentPath.startsWith(node.path)) {
                childContainer.classList.remove('collapsed');
            } else {
                childContainer.classList.add('collapsed');
            }
            renderTree(node.children, childContainer);
            container.appendChild(childContainer);
            const arrow = item.querySelector('.arrow');
            if (arrow) {
                arrow.addEventListener('click', function(e) {
                    e.stopPropagation();
                    childContainer.classList.toggle('collapsed');
                    arrow.classList.toggle('open');
                });
            }
        }
    });
}

function getAllFilePaths() {
    const paths = [];
    for (let file of fileList) {
        if (!file.is_dir) {
            paths.push(file.path);
        }
    }
    return paths;
}

function getTargetFiles() {
    const selected = getSelectedPaths();
    if (selected.length > 0) {
        return selected;
    }
    return getAllFilePaths();
}

async function loadFiles(path) {
    currentPath = path;
    currentPathDisplay.textContent = path;
    document.getElementById('moveSourcePath').textContent = path;
    document.getElementById('deleteSourcePath').textContent = path;
    statusLeft.textContent = '📂 加载中...';
    try {
        const result = await fetchFiles(path);
        if (result.error) throw new Error(result.error);
        fileList = result.files || [];
        selectedFiles.clear();
        renderFiles(fileList);
        updateTreeHighlight(path);
        statusLeft.textContent = '📂 ' + path;
        updateTargetSelect();
        autoPreview();
    } catch (err) {
        statusLeft.textContent = '❌ 加载失败: ' + err.message;
    }
}

function updateTreeHighlight(path) {
    document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
    const parts = path.split('/').filter(p => p);
    let currentContainer = treeContainer;
    for (let i = 0; i < parts.length; i++) {
        const items = currentContainer.querySelectorAll(':scope > .tree-item');
        for (let item of items) {
            const nameEl = item.querySelector('.name');
            if (nameEl && nameEl.textContent === parts[i]) {
                item.classList.add('active');
                const childContainer = item.parentElement.querySelector(':scope > .tree-children');
                if (childContainer) {
                    childContainer.classList.remove('collapsed');
                    const arrow = item.querySelector('.arrow');
                    if (arrow) arrow.classList.add('open');
                    currentContainer = childContainer;
                }
                break;
            }
        }
    }
}

async function initTree() {
    try {
        const result = await fetchTree('/');
        if (result.error) throw new Error(result.error);
        fullTreeData = result.tree || [];
        renderTree(fullTreeData, treeContainer);
        await loadFiles('/');
    } catch (err) {
        treeContainer.innerHTML = '<div style="padding:20px;text-align:center;color:#e53e3e;">❌ 加载失败</div>';
    }
}

async function navigateTo(path) {
    renamePreview = {};
    await loadFiles(path);
}

function applyRenameAction(old_name, action, data) {
    let name, ext, new_name;
    
    switch(action) {
        case 'replace':
            const findStr = data.find || '';
            const replaceStr = data.replace || '';
            if (findStr) {
                if (data.case_sensitive) {
                    new_name = old_name.replace(findStr, replaceStr);
                } else {
                    new_name = old_name.toLowerCase().replace(findStr.toLowerCase(), replaceStr);
                }
            } else {
                new_name = old_name;
            }
            break;
        case 'regex':
            const regexFind = data.find || '';
            const regexReplace = data.replace || '';
            if (regexFind) {
                try {
                    const flags = data.case_sensitive ? '' : 'i';
                    new_name = old_name.replace(new RegExp(regexFind, flags), regexReplace);
                } catch(e) {
                    new_name = old_name;
                }
            } else {
                new_name = old_name;
            }
            break;
        case 'prefix':
            new_name = (data.replace || '') + old_name;
            break;
        case 'suffix':
            name = getFileNameWithoutExt(old_name);
            ext = getFileExtension(old_name);
            new_name = name + (data.replace || '') + ext;
            break;
        case 'number':
            new_name = old_name;
            break;
        case 'lowercase':
            new_name = old_name.toLowerCase();
            break;
        case 'uppercase':
            new_name = old_name.toUpperCase();
            break;
        case 'capitalize':
            name = getFileNameWithoutExt(old_name);
            ext = getFileExtension(old_name);
            new_name = name.charAt(0).toUpperCase() + name.slice(1) + ext;
            break;
        case 'titlecase':
            name = getFileNameWithoutExt(old_name);
            ext = getFileExtension(old_name);
            new_name = name.replace(/\w\S*/g, function(txt) {
                return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
            }) + ext;
            break;
        case 'camelcase':
            name = getFileNameWithoutExt(old_name);
            ext = getFileExtension(old_name);
            const parts2 = name.replace(/[_\-\s]+/g, ' ').split(' ');
            if (parts2.length > 0) {
                new_name = parts2[0].toLowerCase() + parts2.slice(1).map(function(p) {
                    return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
                }).join('') + ext;
            } else {
                new_name = old_name;
            }
            break;
        case 'extension':
            name = getFileNameWithoutExt(old_name);
            const extAction = data.ext_action || 'change';
            const extValue = data.ext_value || '';
            if (extAction === 'change') {
                new_name = name + (extValue ? '.' + extValue : '');
            } else if (extAction === 'add') {
                new_name = old_name + (extValue ? '.' + extValue : '');
            } else if (extAction === 'remove') {
                new_name = name;
            } else if (extAction === 'replace') {
                new_name = name + (extValue ? '.' + extValue : '');
            } else {
                new_name = old_name;
            }
            break;
        case 'remove':
            const removeStr = data.find || '';
            if (removeStr) {
                new_name = old_name.replace(new RegExp(removeStr, 'g'), '');
            } else {
                new_name = old_name;
            }
            break;
        case 'removepos':
            const startPos = (data.start || 1) - 1;
            const length = data.length || 1;
            const fromEnd = data.from_end || false;
            name = getFileNameWithoutExt(old_name);
            ext = getFileExtension(old_name);
            let pos = startPos;
            if (fromEnd) {
                pos = name.length - startPos - length + 1;
            }
            if (pos >= 0 && pos < name.length) {
                new_name = name.substring(0, pos) + name.substring(pos + length) + ext;
            } else {
                new_name = old_name;
            }
            break;
        case 'date':
            new_name = old_name;
            break;
        default:
            new_name = old_name;
            break;
    }
    return new_name;
}

function getRenameParams() {
    const action = document.getElementById('renameAction').value;
    const params = { action: action };
    switch(action) {
        case 'replace':
        case 'regex':
            params.find = document.getElementById('findText').value || '';
            params.replace = document.getElementById('replaceText').value || '';
            params.case_sensitive = document.getElementById('caseSensitive').checked;
            break;
        case 'prefix':
        case 'suffix':
            params.replace = document.getElementById('replaceText').value || '';
            break;
        case 'remove':
            params.find = document.getElementById('findText').value || '';
            break;
        case 'number':
            params.start = parseInt(document.getElementById('startNum').value) || 1;
            params.step = parseInt(document.getElementById('stepNum').value) || 1;
            params.digits = parseInt(document.getElementById('digitsNum').value) || 2;
            params.position = document.getElementById('numberPos').value;
            break;
        case 'extension':
            params.ext_action = document.getElementById('extAction').value;
            params.ext_value = document.getElementById('extValue').value || '';
            break;
        case 'removepos':
            params.start = parseInt(document.getElementById('removeStart').value) || 1;
            params.length = parseInt(document.getElementById('removeLen').value) || 1;
            params.from_end = document.getElementById('removeFromEnd').checked;
            break;
        case 'date':
            params.date_type = document.getElementById('dateType').value;
            params.date_format = document.getElementById('dateFormat').value;
            params.date_pos = document.getElementById('datePos').value;
            break;
        case 'lowercase':
        case 'uppercase':
        case 'capitalize':
        case 'titlecase':
        case 'camelcase':
            break;
    }
    return params;
}

function getSelectedPaths() {
    return Array.from(selectedFiles);
}

function autoPreview() {
    let targetFiles = getSelectedPaths();
    const allFiles = getAllFilePaths();
    
    if (targetFiles.length === 0) {
        targetFiles = allFiles;
    }
    
    const params = getRenameParams();
    
    if (targetFiles.length === 0 || !params.action) {
        renamePreview = {};
        renderFiles(fileList);
        return;
    }

    if (params.action === 'number' || params.action === 'date') {
        renamePreview = {};
        renderFiles(fileList);
        return;
    }

    const previewMap = {};
    let hasChanges = false;
    for (let filePath of targetFiles) {
        const oldName = getFileName(filePath);
        const newName = applyRenameAction(oldName, params.action, params);
        if (newName !== oldName) {
            previewMap[filePath] = newName;
            hasChanges = true;
        }
    }
    
    if (hasChanges) {
        renamePreview = previewMap;
    } else {
        renamePreview = {};
    }
    renderFiles(fileList);
}

function renderFiles(files) {
    const tbody = fileTableBody;
    tbody.innerHTML = '';
    if (!files || files.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="6">📭 此目录为空</td></tr>';
        fileCountDisplay.textContent = '0 项';
        updateSelectedInfo();
        return;
    }
    fileList = files;
    files.sort((a, b) => {
        if (a.is_dir && !b.is_dir) return -1;
        if (!a.is_dir && b.is_dir) return 1;
        return a.name.localeCompare(b.name);
    });
    fileCountDisplay.textContent = files.length + ' 项';
    files.forEach(file => {
        const tr = document.createElement('tr');
        const isDir = file.is_dir;
        const icon = isDir ? '📁' : '📄';
        const size = isDir ? '' : formatSize(file.size);
        const date = file.modified ? new Date(file.modified * 1000).toLocaleString() : '-';
        const newName = renamePreview[file.path] || file.name;
        const isChanged = newName !== file.name && !isDir;
        const statusText = isDir ? '📁 文件夹' : (isChanged ? '🔄 修改' : '✓ 不变');
        const statusClass = isChanged ? 'changed' : 'ok';
        const checked = selectedFiles.has(file.path) ? 'checked' : '';
        tr.innerHTML =
            '<td class="checkbox-col"><input type="checkbox" value="' + escapeHtml(file.path) + '" ' + checked + '></td>' +
            '<td class="name-col' + (isDir ? ' folder-row' : '') + '">' + icon + ' ' + escapeHtml(file.name) + '</td>' +
            '<td class="new-name-col' + (isChanged && !isDir ? '' : ' unchanged') + '">' + (isDir ? '-' : escapeHtml(newName)) + '</td>' +
            '<td class="size-col">' + size + '</td>' +
            '<td class="date-col">' + date + '</td>' +
            '<td class="status-col ' + statusClass + '">' + statusText + '</td>';
        
        const checkbox = tr.querySelector('input[type="checkbox"]');
        checkbox.addEventListener('change', function() {
            if (this.checked) {
                selectedFiles.add(file.path);
                tr.classList.add('selected');
            } else {
                selectedFiles.delete(file.path);
                tr.classList.remove('selected');
            }
            updateSelectedInfo();
            autoPreview();
        });
        
        tbody.appendChild(tr);
    });
    updateSelectedInfo();
}

function updateSelectedInfo() {
    const count = selectedFiles.size;
    if (count > 0) {
        selectedInfo.textContent = '✅ 已选 ' + count + ' 项';
    } else {
        selectedInfo.textContent = '';
    }
    const allCheckboxes = document.querySelectorAll('#fileTableBody input[type="checkbox"]');
    const checkedCheckboxes = document.querySelectorAll('#fileTableBody input[type="checkbox"]:checked');
    const selectAll = document.getElementById('selectAll');
    if (allCheckboxes.length > 0) {
        selectAll.checked = allCheckboxes.length === checkedCheckboxes.length;
    }
}

function formatSize(bytes) {
    if (!bytes) return '';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showLog(msg, type) {
    logArea.classList.add('show');
    const div = document.createElement('div');
    div.className = 'log-line ' + (type || 'info');
    div.textContent = msg;
    logArea.appendChild(div);
    logArea.scrollTop = logArea.scrollHeight;
}

function clearLog() { logArea.innerHTML = ''; logArea.classList.remove('show'); }

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });
});

document.getElementById('selectAllBtn').addEventListener('click', function() {
    document.querySelectorAll('#fileTableBody input[type="checkbox"]').forEach(cb => {
        cb.checked = true;
        cb.dispatchEvent(new Event('change'));
    });
});

document.getElementById('clearAllBtn').addEventListener('click', function() {
    document.querySelectorAll('#fileTableBody input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
        cb.dispatchEvent(new Event('change'));
    });
});

document.getElementById('selectAll').addEventListener('change', function() {
    document.querySelectorAll('#fileTableBody input[type="checkbox"]').forEach(cb => {
        cb.checked = this.checked;
        cb.dispatchEvent(new Event('change'));
    });
});

document.getElementById('renameAction').addEventListener('change', function() {
    const action = this.value;
    document.getElementById('findLabel').style.display = 'inline';
    document.getElementById('findText').style.display = 'inline';
    document.getElementById('replaceLabel').style.display = 'inline';
    document.getElementById('replaceText').style.display = 'inline';
    document.getElementById('caseSensitive').parentElement.style.display = 'inline-flex';
    document.getElementById('numParams').style.display = 'none';
    document.getElementById('extParams').style.display = 'none';
    document.getElementById('removePosParams').style.display = 'none';
    document.getElementById('dateParams').style.display = 'none';

    switch(action) {
        case 'number':
            document.getElementById('numParams').style.display = 'inline';
            document.getElementById('findLabel').style.display = 'none';
            document.getElementById('findText').style.display = 'none';
            document.getElementById('replaceLabel').style.display = 'none';
            document.getElementById('replaceText').style.display = 'none';
            document.getElementById('caseSensitive').parentElement.style.display = 'none';
            break;
        case 'extension':
            document.getElementById('extParams').style.display = 'inline';
            document.getElementById('findLabel').style.display = 'none';
            document.getElementById('findText').style.display = 'none';
            document.getElementById('replaceLabel').style.display = 'none';
            document.getElementById('replaceText').style.display = 'none';
            document.getElementById('caseSensitive').parentElement.style.display = 'none';
            break;
        case 'removepos':
            document.getElementById('removePosParams').style.display = 'inline';
            document.getElementById('findLabel').style.display = 'none';
            document.getElementById('findText').style.display = 'none';
            document.getElementById('replaceLabel').style.display = 'none';
            document.getElementById('replaceText').style.display = 'none';
            document.getElementById('caseSensitive').parentElement.style.display = 'none';
            break;
        case 'date':
            document.getElementById('dateParams').style.display = 'inline';
            document.getElementById('findLabel').style.display = 'none';
            document.getElementById('findText').style.display = 'none';
            document.getElementById('replaceLabel').style.display = 'none';
            document.getElementById('replaceText').style.display = 'none';
            document.getElementById('caseSensitive').parentElement.style.display = 'none';
            break;
        case 'prefix':
            document.getElementById('findLabel').style.display = 'none';
            document.getElementById('findText').style.display = 'none';
            document.getElementById('replaceLabel').textContent = '前缀';
            document.getElementById('replaceText').placeholder = '输入前缀...';
            document.getElementById('caseSensitive').parentElement.style.display = 'none';
            break;
        case 'suffix':
            document.getElementById('findLabel').style.display = 'none';
            document.getElementById('findText').style.display = 'none';
            document.getElementById('replaceLabel').textContent = '后缀';
            document.getElementById('replaceText').placeholder = '输入后缀...';
            document.getElementById('caseSensitive').parentElement.style.display = 'none';
            break;
        case 'remove':
            document.getElementById('replaceLabel').style.display = 'none';
            document.getElementById('replaceText').style.display = 'none';
            document.getElementById('findLabel').textContent = '删除';
            document.getElementById('findText').placeholder = '要删除的字符...';
            document.getElementById('caseSensitive').parentElement.style.display = 'none';
            break;
        case 'lowercase':
        case 'uppercase':
        case 'capitalize':
        case 'titlecase':
        case 'camelcase':
            document.getElementById('findLabel').style.display = 'none';
            document.getElementById('findText').style.display = 'none';
            document.getElementById('replaceLabel').style.display = 'none';
            document.getElementById('replaceText').style.display = 'none';
            document.getElementById('caseSensitive').parentElement.style.display = 'none';
            break;
        default:
            document.getElementById('findLabel').textContent = '查找';

// ===== 执行重命名 =====
document.getElementById('executeRenameBtn').addEventListener('click', async function() {
    let files = getSelectedPaths();
    if (files.length === 0) {
        files = getAllFilePaths();
    }
    if (files.length === 0) {
        showLog('⚠️ 当前目录没有文件', 'warning');
        return;
    }
    
    let hasChange = false;
    for (let f of files) {
        if (renamePreview[f] && renamePreview[f] !== getFileName(f)) {
            hasChange = true;
            break;
        }
    }
    if (!hasChange) {
        showLog('⚠️ 没有文件需要修改', 'warning');
        return;
    }
    
    const params = getRenameParams();
    const filesToRename = [];
    for (let f of files) {
        if (renamePreview[f] && renamePreview[f] !== getFileName(f)) {
            filesToRename.push({
                old_path: f,
                new_path: f.substring(0, f.lastIndexOf('/') + 1) + renamePreview[f],
                old_name: getFileName(f),
                new_name: renamePreview[f]
            });
        }
    }
    
    if (filesToRename.length === 0) {
        showLog('⚠️ 没有文件需要修改', 'warning');
        return;
    }
    
    if (!confirm('确定要重命名 ' + filesToRename.length + ' 个文件吗？')) return;

    clearLog();
    showLog('⏳ 开始重命名 ' + filesToRename.length + ' 个文件...', 'info');

    try {
        const result = await apiCall('/api/execute', {
            action: params.action,
            files: filesToRename,
            ...params
        });
        if (result.error) { showLog('❌ ' + result.error, 'error'); return; }
        if (result.logs) result.logs.forEach(log => showLog(log.text, log.type || 'info'));
        if (result.stats) showLog('✅ ' + result.stats.message, 'success');
        if (result.history && result.history.length > 0) {
            renameHistory.push(...result.history);
            document.getElementById('undoBtn').disabled = false;
        }
        renamePreview = {};
        selectedFiles.clear();
        await loadFiles(currentPath);
    } catch(e) {
        showLog('❌ ' + e.message, 'error');
    }
});

document.getElementById('refreshTreeBtn').addEventListener('click', function() {
    initTree();
});

document.getElementById('undoBtn').addEventListener('click', async function() {
    if (renameHistory.length === 0) return;
    try {
        const result = await undoRename();
        if (result.error) { showLog('❌ ' + result.error, 'error'); return; }
        showLog('↩ ' + result.message, 'success');
        renameHistory.pop();
        if (renameHistory.length === 0) this.disabled = true;
        renamePreview = {};
        selectedFiles.clear();
        await loadFiles(currentPath);
    } catch(e) { showLog('❌ ' + e.message, 'error'); }
});

// ===== 删除功能 =====
document.getElementById('deleteBtn').addEventListener('click', function() {
    const selected = getSelectedPaths();
    if (selected.length > 0) {
        const fileNames = selected.map(f => getFileName(f)).join('\n  ');
        if (!confirm('⚠️ 确定要删除以下 ' + selected.length + ' 个文件/目录吗？\n\n  ' + fileNames + '\n\n此操作不可恢复！')) {
            return;
        }
        deleteItems(selected);

    }
    
    const allFiles = getAllFilePaths();
    if (allFiles.length === 0) {
        showLog('⚠️ 当前目录没有文件可删除', 'warning');

    }

    document.getElementById('deleteFileCount').textContent = '（当前目录 ' + allFiles.length + ' 个文件）';

});

function getDeleteFilters() {
    const filters = {};
    const v = (id) => document.getElementById(id).value.trim();
    if (v('delFilterNameContains')) filters.name_contains = v('delFilterNameContains');
    if (v('delFilterNameNotContains')) filters.name_not_contains = v('delFilterNameNotContains');
    if (v('delFilterExtensions')) filters.extensions = v('delFilterExtensions').split(',').map(s => s.trim()).filter(s => s);
    if (v('delFilterExtNot')) filters.extensions_not = v('delFilterExtNot').split(',').map(s => s.trim()).filter(s => s);
    if (v('delFilterMinSize')) filters.min_size = parseInt(v('delFilterMinSize'));
    if (v('delFilterMaxSize')) filters.max_size = parseInt(v('delFilterMaxSize'));
    if (v('delFilterDateAfter')) filters.date_after = v('delFilterDateAfter');
    if (v('delFilterDateBefore')) filters.date_before = v('delFilterDateBefore');
    if (v('delFilterFileTypes')) filters.file_types = v('delFilterFileTypes');
    if (v('delFilterRegex')) filters.regex = v('delFilterRegex');
    return filters;
}

document.getElementById('deleteConfirmBtn').addEventListener('click', async function() {
    closeModal('deleteModal');
    
    const filters = getDeleteFilters();
    const allFiles = getAllFilePaths();
    
    // 检查过滤条件是否为空
    const hasFilters = Object.keys(filters).length > 0;
    if (!hasFilters) {
        showLog('⚠️ 请设置过滤条件，否则不会删除任何文件', 'warning');
        return;
    }
    
    if (allFiles.length === 0) {
        showLog('⚠️ 当前目录没有文件可删除', 'warning');
        return;
    }
    
    try {
        const result = await apiCall('/api/filter_preview', { files: allFiles, filters });
        if (result.matched === 0) {
            showLog('⚠️ 没有文件匹配过滤条件', 'warning');
            return;
        }
        const files = result.matched_files;
        showLog('📋 过滤后匹配 ' + files.length + ' 个文件', 'info');
        
        const fileNames = files.map(f => getFileName(f)).join('\n  ');
        if (!confirm('⚠️ 确定要删除以下 ' + files.length + ' 个文件/目录吗？\n\n  ' + fileNames + '\n\n此操作不可恢复！')) {
            return;
        }
        deleteItems(files);
    } catch(e) {
        showLog('❌ 过滤失败: ' + e.message, 'error');
        return;
    }
});

async function deleteItems(files) {
    clearLog();
    showLog('⏳ 开始删除 ' + files.length + ' 个文件/目录...', 'info');
    
    let deleted = 0;
    let failed = 0;
    
    for (let filePath of files) {
        try {
            const result = await apiCall('/api/delete', { files: [filePath] });
            if (result.error) {
                failed++;
                showLog('❌ 删除失败: ' + getFileName(filePath) + ' - ' + result.error, 'error');
            } else {
                deleted++;
                if (result.logs) {
                    result.logs.forEach(log => showLog(log.text, log.type || 'info'));
                }
            }
        } catch(e) {
            failed++;
            showLog('❌ 删除失败: ' + getFileName(filePath) + ' - ' + e.message, 'error');
        }
    }
    
    if (deleted > 0) {
        showLog('✅ 成功删除 ' + deleted + ' 个文件/目录', 'success');
    }
    if (failed > 0) {
        showLog('⚠️ 删除失败 ' + failed + ' 个文件/目录', 'error');
    }
    
    renamePreview = {};
    selectedFiles.clear();
    await loadFiles(currentPath);
}

document.getElementById('moveCopyConfirmBtn').addEventListener('click', async function() {
    const action = document.getElementById('moveCopyAction').value;
    let targetDir = document.getElementById('moveTargetSelect').value.trim();
    const inputDir = document.getElementById('moveTargetInput').value.trim();

    if (inputDir) {
        targetDir = inputDir;
    }

    if (!targetDir) {
        alert('请选择或输入目标目录');
        return;
    }

    let files = getSelectedPaths();
    // 有选中文件 → 直接操作选中的
    if (files.length > 0) {
        closeModal('moveCopyModal');
        clearLog();
        showLog('⏳ 开始' + (action === 'move' ? '移动' : '复制') + ' ' + files.length + ' 个文件到: ' + targetDir, 'info');
        try {
            const result = await apiCall('/api/execute', {
                action: action,
                files: files.map(f => ({ old_path: f })),
                target_dir: targetDir,
                overwrite: document.getElementById('moveOverwrite').checked
            });
            if (result.error) { showLog('❌ ' + result.error, 'error'); return; }
            if (result.logs) result.logs.forEach(log => showLog(log.text, log.type || 'info'));
            if (result.stats) showLog('✅ ' + result.stats.message, 'success');
            if (result.history && result.history.length > 0) {
                renameHistory.push(...result.history);
                document.getElementById('undoBtn').disabled = false;
            }
            renamePreview = {};
            selectedFiles.clear();
            await loadFiles(currentPath);
        } catch(e) {
            showLog('❌ ' + e.message, 'error');
        }
        return;
    }

    // 没有选中文件 → 使用过滤条件
    const filters = getFilters();
    const allFiles = getAllFilePaths();
    
    // 检查过滤条件是否为空
    const hasFilters = Object.keys(filters).length > 0;
    if (!hasFilters) {
        showLog('⚠️ 请设置过滤条件，否则不会匹配任何文件', 'warning');
        return;
    }
    
    if (allFiles.length === 0) {
        showLog('⚠️ 当前目录没有文件', 'warning');
        closeModal('moveCopyModal');
        return;
    }

    closeModal('moveCopyModal');
    clearLog();
    
    try {
        const result = await apiCall('/api/filter_preview', { files: allFiles, filters });
        if (result.matched === 0) {
            showLog('⚠️ 没有文件匹配过滤条件', 'warning');
            return;
        }
        files = result.matched_files;
        showLog('📋 过滤后匹配 ' + files.length + ' 个文件', 'info');
    } catch(e) {
        showLog('❌ 过滤失败: ' + e.message, 'error');
        return;
    }

    showLog('⏳ 开始' + (action === 'move' ? '移动' : '复制') + ' ' + files.length + ' 个文件到: ' + targetDir, 'info');

    try {
        const result = await apiCall('/api/execute', {
            action: action,
            files: files.map(f => ({ old_path: f })),
            target_dir: targetDir,
            overwrite: document.getElementById('moveOverwrite').checked,
            filters: filters
        });
        if (result.error) { showLog('❌ ' + result.error, 'error'); return; }
        if (result.logs) result.logs.forEach(log => showLog(log.text, log.type || 'info'));
        if (result.stats) showLog('✅ ' + result.stats.message, 'success');
        if (result.history && result.history.length > 0) {
            renameHistory.push(...result.history);
            document.getElementById('undoBtn').disabled = false;
        }
        renamePreview = {};
        selectedFiles.clear();
        await loadFiles(currentPath);
    } catch(e) {
        showLog('❌ ' + e.message, 'error');
    }
});
