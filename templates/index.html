<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📂 文件工具箱</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: #1a1d27;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        /* ===== 顶部标题栏 ===== */
        .header {
            padding: 16px 24px;
            background: #222632;
            border-bottom: 1px solid #2d313e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 18px;
            color: #e4e6eb;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-actions .badge {
            color: #8b8fa3;
            font-size: 12px;
            background: #2d313e;
            padding: 4px 14px;
            border-radius: 20px;
        }

        /* ===== 主体布局 ===== */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== 左侧：目录树 ===== */
        .sidebar {
            width: 280px;
            min-width: 200px;
            background: #14171f;
            border-right: 1px solid #2d313e;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            background: #1a1d27;
            border-bottom: 1px solid #2d313e;
            font-size: 12px;
            color: #8b8fa3;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .sidebar-header .refresh-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .sidebar-header .refresh-btn:hover {
            background: #2d313e;
        }

        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .tree-container::-webkit-scrollbar {
            width: 4px;
        }

        .tree-container::-webkit-scrollbar-track {
            background: #14171f;
        }

        .tree-container::-webkit-scrollbar-thumb {
            background: #2d313e;
            border-radius: 4px;
        }

        .tree-item {
            display: flex;
            align-items: center;
            padding: 4px 12px 4px 8px;
            cursor: pointer;
            color: #b5b9c9;
            font-size: 13px;
            border-radius: 4px;
            margin: 1px 6px;
            transition: all 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tree-item:hover {
            background: #2d313e;
            color: #e4e6eb;
        }

        .tree-item.active {
            background: #2d3b6e;
            color: #e4e6eb;
        }

        .tree-item .icon {
            margin-right: 8px;
            font-size: 16px;
            flex-shrink: 0;
            width: 22px;
            text-align: center;
        }

        .tree-item .name {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tree-item .size {
            margin-left: auto;
            font-size: 11px;
            color: #6b6f83;
            flex-shrink: 0;
            padding-left: 12px;
        }

        .tree-item.folder .icon {
            color: #f0c94d;
        }

        .tree-item.file .icon {
            color: #6b8fc0;
        }

        .tree-item .arrow {
            margin-left: auto;
            font-size: 12px;
            color: #6b6f83;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .tree-item .arrow.open {
            transform: rotate(90deg);
        }

        .tree-children {
            padding-left: 20px;
            overflow: hidden;
        }

        .tree-children.collapsed {
            display: none;
        }

        /* ===== 右侧：文件列表 ===== */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* 面包屑导航 */
        .breadcrumb {
            padding: 12px 20px;
            background: #1a1d27;
            border-bottom: 1px solid #2d313e;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
            min-height: 48px;
        }

        .breadcrumb .sep {
            color: #4a4e62;
        }

        .breadcrumb .crumb {
            color: #8b8fa3;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .breadcrumb .crumb:hover {
            background: #2d313e;
            color: #e4e6eb;
        }

        .breadcrumb .crumb.current {
            color: #e4e6eb;
            font-weight: 600;
            cursor: default;
        }

        .breadcrumb .crumb.current:hover {
            background: transparent;
        }

        .breadcrumb .path-input {
            flex: 1;
            background: #14171f;
            border: 1px solid #2d313e;
            border-radius: 6px;
            color: #e4e6eb;
            padding: 4px 12px;
            font-size: 13px;
            min-width: 100px;
            outline: none;
            font-family: inherit;
        }

        .breadcrumb .path-input:focus {
            border-color: #667eea;
        }

        /* 文件列表工具栏 */
        .file-toolbar {
            padding: 8px 20px;
            background: #1a1d27;
            border-bottom: 1px solid #2d313e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        .file-toolbar .info {
            color: #8b8fa3;
            font-size: 13px;
        }

        .file-toolbar .info strong {
            color: #e4e6eb;
        }

        .file-toolbar .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .file-toolbar .actions button {
            background: #2d313e;
            border: none;
            color: #b5b9c9;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .file-toolbar .actions button:hover:not(:disabled) {
            background: #3d4150;
            color: #e4e6eb;
        }

        .file-toolbar .actions button.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .file-toolbar .actions button.primary:hover:not(:disabled) {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .file-toolbar .actions button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* 文件列表表格 */
        .file-list-container {
            flex: 1;
            overflow: auto;
            padding: 0 20px 20px 20px;
        }

        .file-list-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .file-list-container::-webkit-scrollbar-track {
            background: #14171f;
        }

        .file-list-container::-webkit-scrollbar-thumb {
            background: #2d313e;
            border-radius: 4px;
        }

        .file-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .file-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .file-table th {
            text-align: left;
            padding: 10px 12px;
            color: #8b8fa3;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2d313e;
            background: #1a1d27;
        }

        .file-table td {
            padding: 8px 12px;
            color: #b5b9c9;
            border-bottom: 1px solid #1f222c;
            cursor: pointer;
            transition: background 0.1s;
        }

        .file-table tr:hover td {
            background: #222632;
        }

        .file-table tr.selected td {
            background: #2d3b6e;
        }

        .file-table .icon-col {
            width: 30px;
            text-align: center;
        }

        .file-table .name-col {
            font-weight: 500;
        }

        .file-table .name-col .ext {
            color: #6b6f83;
            font-weight: 400;
        }

        .file-table .size-col {
            color: #6b6f83;
            font-size: 12px;
        }

        .file-table .date-col {
            color: #6b6f83;
            font-size: 12px;
        }

        .file-table .checkbox-col {
            width: 30px;
            text-align: center;
        }

        .file-table .checkbox-col input[type="checkbox"] {
            accent-color: #667eea;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .file-table .folder-row .name-col {
            color: #f0c94d;
        }

        .file-table .empty-row td {
            padding: 40px;
            text-align: center;
            color: #4a4e62;
            font-size: 14px;
        }

        /* ===== 底部状态栏 ===== */
        .status-bar {
            padding: 6px 20px;
            background: #14171f;
            border-top: 1px solid #2d313e;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #4a4e62;
            flex-shrink: 0;
        }

        /* ===== 弹窗/模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #1a1d27;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #2d313e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .modal h2 {
            color: #e4e6eb;
            font-size: 18px;
            margin-bottom: 16px;
        }

        .modal .form-group {
            margin-bottom: 14px;
        }

        .modal .form-group label {
            display: block;
            color: #8b8fa3;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 8px 12px;
            background: #14171f;
            border: 1px solid #2d313e;
            border-radius: 6px;
            color: #e4e6eb;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .modal .form-group input:focus,
        .modal .form-group select:focus {
            border-color: #667eea;
        }

        .modal .form-group .hint {
            color: #4a4e62;
            font-size: 12px;
            margin-top: 3px;
        }

        .modal .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .modal .btn-row button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .modal .btn-row .btn-confirm {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .modal .btn-row .btn-confirm:hover {
            opacity: 0.85;
        }

        .modal .btn-row .btn-cancel {
            background: #2d313e;
            color: #b5b9c9;
        }

        .modal .btn-row .btn-cancel:hover {
            background: #3d4150;
        }

        .modal .preview-list {
            max-height: 200px;
            overflow-y: auto;
            background: #14171f;
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 0;
            font-size: 13px;
            font-family: monospace;
            color: #b5b9c9;
        }

        .modal .preview-list .changed {
            color: #68d391;
        }

        .modal .preview-list .unchanged {
            color: #4a4e62;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
                min-width: 140px;
            }
            .container {
                height: 95vh;
                border-radius: 0;
            }
            .file-table {
                font-size: 12px;
            }
            .file-table th,
            .file-table td {
                padding: 6px 8px;
            }
            .breadcrumb {
                padding: 8px 12px;
            }
            .file-toolbar {
                padding: 6px 12px;
            }
            .file-list-container {
                padding: 0 8px 8px 8px;
            }
        }

        @media (max-width: 500px) {
            .sidebar {
                display: none;
            }
            .file-table .date-col {
                display: none;
            }
            .file-table .size-col {
                display: none;
            }
        }

        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #2d313e;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .log-area {
            margin-top: 12px;
            background: #14171f;
            border-radius: 8px;
            padding: 12px 16px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            display: none;
        }

        .log-area.show {
            display: block;
        }

        .log-area .log-line {
            color: #8b8fa3;
            padding: 2px 0;
            border-bottom: 1px solid #1f222c;
        }

        .log-area .log-line.success {
            color: #68d391;
        }

        .log-area .log-line.error {
            color: #fc8181;
        }

        .log-area .log-line.info {
            color: #63b3ed;
        }

        .log-area::-webkit-scrollbar {
            width: 4px;
        }
        .log-area::-webkit-scrollbar-track {
            background: #14171f;
        }
        .log-area::-webkit-scrollbar-thumb {
            background: #2d313e;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部标题 -->
        <div class="header">
            <h1>
                📂 <span>文件工具箱</span>
            </h1>
            <div class="header-actions">
                <span class="badge">🔄 本地处理 · 隐私安全</span>
            </div>
        </div>

        <!-- 主体 -->
        <div class="main">
            <!-- 左侧：目录树 -->
            <div class="sidebar">
                <div class="sidebar-header">
                    📁 目录树
                    <button class="refresh-btn" id="refreshTreeBtn" title="刷新">⟳</button>
                </div>
                <div class="tree-container" id="treeContainer">
                    <div style="padding:20px;text-align:center;color:#4a4e62;font-size:13px;">
                        <span class="loading-spinner"></span> 加载中...
                    </div>
                </div>
            </div>

            <!-- 右侧：文件列表 -->
            <div class="content">
                <!-- 面包屑导航 -->
                <div class="breadcrumb" id="breadcrumb">
                    <span class="crumb current">/</span>
                </div>

                <!-- 工具栏 -->
                <div class="file-toolbar">
                    <div class="info">
                        📄 共 <strong id="fileCount">0</strong> 项
                        <span id="selectedInfo" style="margin-left:12px;color:#667eea;"></span>
                    </div>
                    <div class="actions">
                        <button id="renameBtn" class="primary" disabled>✏️ 重命名</button>
                        <button id="dedupBtn" class="primary" disabled>🧹 去重</button>
                        <button id="compressBtn" class="primary" disabled>🗜️ 压缩</button>
                        <button id="refreshBtn">⟳ 刷新</button>
                    </div>
                </div>

                <!-- 文件列表 -->
                <div class="file-list-container" id="fileListContainer">
                    <table class="file-table">
                        <thead>
                            <tr>
                                <th class="checkbox-col">
                                    <input type="checkbox" id="selectAll">
                                </th>
                                <th class="icon-col"></th>
                                <th class="name-col">名称</th>
                                <th class="size-col">大小</th>
                                <th class="date-col">修改时间</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody">
                            <tr class="empty-row">
                                <td colspan="5">📭 请选择目录</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 日志区域 -->
                <div class="log-area" id="logArea"></div>
            </div>
        </div>

        <!-- 底部状态栏 -->
        <div class="status-bar">
            <span id="statusLeft">就绪</span>
            <span id="statusRight">ghcr.io/gruntfish/nas-file-tool</span>
        </div>
    </div>

    <!-- ===== 模态框：重命名 ===== -->
    <div class="modal-overlay" id="renameModal">
        <div class="modal">
            <h2>✏️ 批量重命名</h2>
            <div class="form-group">
                <label>🔍 匹配模式</label>
                <input type="text" id="renamePattern" placeholder="例如: IMG_ 或 ^(.*)\.(.*)$" value="">
                <div class="hint">支持正则表达式，例如 <code>IMG_</code> 匹配包含 IMG_ 的文件</div>
            </div>
            <div class="form-group">
                <label>🔄 替换为</label>
                <input type="text" id="renameReplacement" placeholder="例如: photo_" value="">
                <div class="hint">替换后的新内容</div>
            </div>
            <div id="renamePreview" style="display:none;">
                <label style="color:#8b8fa3;font-size:13px;font-weight:600;">📋 预览（将修改以下文件）</label>
                <div class="preview-list" id="renamePreviewList"></div>
            </div>
            <div class="btn-row">
                <button class="btn-cancel" onclick="closeModal('renameModal')">取消</button>
                <button class="btn-confirm" id="renameConfirmBtn" disabled>确认重命名</button>
            </div>
        </div>
    </div>

    <!-- ===== 模态框：去重 ===== -->
    <div class="modal-overlay" id="dedupModal">
        <div class="modal">
            <h2>🧹 文件去重</h2>
            <p style="color:#8b8fa3;font-size:14px;margin-bottom:12px;">基于 MD5 查找重复文件</p>
            <div class="form-group">
                <label>⚙️ 操作</label>
                <select id="dedupAction">
                    <option value="find">仅查找（列出重复文件）</option>
                    <option value="delete">查找并删除重复（保留第一个）</option>
                </select>
            </div>
            <div class="btn-row">
                <button class="btn-cancel" onclick="closeModal('dedupModal')">取消</button>
                <button class="btn-confirm" id="dedupConfirmBtn">确认执行</button>
            </div>
        </div>
    </div>

    <!-- ===== 模态框：压缩 ===== -->
    <div class="modal-overlay" id="compressModal">
        <div class="modal">
            <h2>🗜️ 图片压缩</h2>
            <p style="color:#8b8fa3;font-size:14px;margin-bottom:12px;">压缩 JPEG / PNG 图片</p>
            <div class="form-group">
                <label>📊 压缩质量</label>
                <select id="compressQuality">
                    <option value="70">70 (高压缩)</option>
                    <option value="80" selected>80 (推荐)</option>
                    <option value="90">90 (高质量)</option>
                </select>
            </div>
            <div class="form-group">
                <label>📁 输出格式</label>
                <select id="compressFormat">
                    <option value="original">保持原格式</option>
                    <option value="webp">统一为 WebP</option>
                    <option value="jpeg">统一为 JPEG</option>
                </select>
            </div>
            <div class="btn-row">
                <button class="btn-cancel" onclick="closeModal('compressModal')">取消</button>
                <button class="btn-confirm" id="compressConfirmBtn">确认压缩</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 全局状态 =====
        let currentPath = '/';
        let treeData = [];
        let fileList = [];
        let selectedFiles = new Set();

        // ===== DOM 引用 =====
        const treeContainer = document.getElementById('treeContainer');
        const fileTableBody = document.getElementById('fileTableBody');
        const fileCount = document.getElementById('fileCount');
        const selectedInfo = document.getElementById('selectedInfo');
        const statusLeft = document.getElementById('statusLeft');
        const logArea = document.getElementById('logArea');

        // ===== API 调用 =====
        async function fetchTree(path) {
            const res = await fetch('/api/tree', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path })
            });
            return res.json();
        }

        async function fetchFiles(path) {
            const res = await fetch('/api/files', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path })
            });
            return res.json();
        }

        async function executeAction(data) {
            const res = await fetch('/api/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return res.json();
        }

        // ===== 渲染目录树 =====
        function renderTree(nodes, container) {
            container.innerHTML = '';
            if (!nodes || nodes.length === 0) {
                container.innerHTML =
                `<div style="padding:20px;text-align:center;color:#4a4e62;font-size:13px;">📭 空目录</div>`;
                return;
            }

            nodes.sort((a, b) => {
                if (a.is_dir && !b.is_dir) return -1;
                if (!a.is_dir && b.is_dir) return 1;
                return a.name.localeCompare(b.name);
            });

            nodes.forEach(node => {
                const item = document.createElement('div');
                item.className = `tree-item ${node.is_dir ? 'folder' : 'file'}`;
                if (node.is_dir && node.path === currentPath) {
                    item.classList.add('active');
                }

                const icon = node.is_dir ? '📁' : '📄';
                const size = node.is_dir ? '' : formatSize(node.size);

                item.innerHTML = `
                    <span class="icon">${icon}</span>
                    <span class="name">${escapeHtml(node.name)}</span>
                    ${size ? `<span class="size">${size}</span>` : ''}
                `;

                item.addEventListener('click', () => {
                    if (node.is_dir) {
                        navigateTo(node.path);
                    } else {
                        const checkbox = document.querySelector(
                            `#fileTableBody input[value="${escapeHtml(node.path)}"]`);
                        if (checkbox) {
                            checkbox.checked = !checkbox.checked;
                            checkbox.dispatchEvent(new Event('change'));
                        }
                    }
                });

                container.appendChild(item);

                if (node.is_dir && node.children && node.children.length > 0) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'tree-children';
                    if (currentPath.startsWith(node.path)) {
                        childrenContainer.classList.remove('collapsed');
                    } else {
                        childrenContainer.classList.add('collapsed');
                    }
                    renderTree(node.children, childrenContainer);
                    container.appendChild(childrenContainer);

                    item.addEventListener('dblclick', (e) => {
                        e.stopPropagation();
                        childrenContainer.classList.toggle('collapsed');
                    });
                }
            });
        }

        // ===== 渲染文件列表 =====
        function renderFiles(files) {
            const tbody = fileTableBody;
            tbody.innerHTML = '';

            if (!files || files.length === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="5">📭 此目录为空</td></tr>`;
                fileCount.textContent = '0';
                return;
            }

            files.sort((a, b) => {
                if (a.is_dir && !b.is_dir) return -1;
                if (!a.is_dir && b.is_dir) return 1;
                return a.name.localeCompare(b.name);
            });

            fileList = files;
            fileCount.textContent = files.length;

            files.forEach((file, index) => {
                const tr = document.createElement('tr');
                const isDir = file.is_dir;
                const icon = isDir ? '📁' : '📄';
                const size = isDir ? '' : formatSize(file.size);
                const date = file.modified ? new Date(file.modified * 1000).toLocaleString() : '-';

                const checkboxId = `file-${index}`;
                const checked = selectedFiles.has(file.path) ? 'checked' : '';

                tr.innerHTML = `
                    <td class="checkbox-col">
                        <input type="checkbox" id="${checkboxId}" value="${escapeHtml(file.path)}" ${checked}>
                    </td>
                    <td class="icon-col">${icon}</td>
                    <td class="name-col ${isDir ? 'folder-row' : ''}">
                        ${escapeHtml(file.name)}
                        ${!isDir ? `<span class="ext">${getExtension(file.name)}</span>` : ''}
                    </td>
                    <td class="size-col">${size}</td>
                    <td class="date-col">${date}</td>
                `;

                if (isDir) {
                    tr.style.cursor = 'pointer';
                    tr.addEventListener('dblclick', () => {
                        navigateTo(file.path);
                    });
                }

                tr.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const cb = tr.querySelector('input[type="checkbox"]');
                        if (cb) {
                            cb.checked = !cb.checked;
                            cb.dispatchEvent(new Event('change'));
                        }
                    }
                });

                const checkbox = tr.querySelector('input[type="checkbox"]');
                checkbox.addEventListener('change', () => {
                    if (checkbox.checked) {
                        selectedFiles.add(file.path);
                        tr.classList.add('selected');
                    } else {
                        selectedFiles.delete(file.path);
                        tr.classList.remove('selected');
                    }
                    updateSelectionInfo();
                });

                tbody.appendChild(tr);
            });

            updateSelectionInfo();
        }

        // ===== 更新选中信息 =====
        function updateSelectionInfo() {
            const count = selectedFiles.size;
            if (count > 0) {
                selectedInfo.textContent = `✅ 已选 ${count} 个文件`;
                document.getElementById('renameBtn').disabled = false;
                document.getElementById('dedupBtn').disabled = false;
                document.getElementById('compressBtn').disabled = false;
            } else {
                selectedInfo.textContent = '';
                document.getElementById('renameBtn').disabled = true;
                document.getElementById('dedupBtn').disabled = true;
                document.getElementById('compressBtn').disabled = true;
            }
        }

        // ===== 导航到目录 =====
        async function navigateTo(path) {
            currentPath = path;
            statusLeft.textContent = `📂 加载中...`;

            try {
                const treeResult = await fetchTree(path);
                if (treeResult.error) throw new Error(treeResult.error);
                treeData = treeResult.tree || [];
                renderTree(treeData, treeContainer);

                const filesResult = await fetchFiles(path);
                if (filesResult.error) throw new Error(filesResult.error);
                renderFiles(filesResult.files || []);

                updateBreadcrumb(path);

                selectedFiles.clear();
                updateSelectionInfo();
                document.getElementById('selectAll').checked = false;

                statusLeft.textContent = `📂 ${path}`;
            } catch (err) {
                statusLeft.textContent = `❌ 加载失败: ${err.message}`;
                console.error(err);
            }
        }

        // ===== 更新面包屑 =====
        function updateBreadcrumb(path) {
            const container = document.getElementById('breadcrumb');
            const parts = path.split('/').filter(p => p);
            let html = '';
            let current = '';

            html += `<span class="crumb" data-path="/">/</span>`;

            parts.forEach((part, index) => {
                current += '/' + part;
                const isLast = index === parts.length - 1;
                html += `<span class="sep">/</span>`;
                html +=
                    `<span class="crumb ${isLast ? 'current' : ''}" data-path="${current}">${escapeHtml(part)}</span>`;
            });

            container.innerHTML = html;

            container.querySelectorAll('.crumb').forEach(el => {
                if (el.classList.contains('current')) return;
                el.addEventListener('click', () => {
                    navigateTo(el.dataset.path);
                });
            });
        }

        // ===== 显示日志 =====
        function showLog(message, type = 'info') {
            logArea.classList.add('show');
            const div = document.createElement('div');
            div.className = `log-line ${type}`;
            div.textContent = message;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLog() {
            logArea.innerHTML = '';
            logArea.classList.remove('show');
        }

        // ===== 模态框 =====
        function openModal(id) {
            document.getElementById(id).classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        // ===== 工具函数 =====
        function formatSize(bytes) {
            if (!bytes) return '';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
                bytes /= 1024;
                i++;
            }
            return bytes.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
        }

        function getExtension(name) {
            const i = name.lastIndexOf('.');
            return i > 0 ? name.slice(i) : '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getSelectedPaths() {
            return Array.from(selectedFiles);
        }

        // ===== 刷新 =====
        document.getElementById('refreshBtn').addEventListener('click', () => navigateTo(currentPath));
        document.getElementById('refreshTreeBtn').addEventListener('click', () => navigateTo(currentPath));

        // ===== 全选 =====
        document.getElementById('selectAll').addEventListener('change', (e) => {
            const checkboxes = document.querySelectorAll('#fileTableBody input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = e.target.checked;
                cb.dispatchEvent(new Event('change'));
            });
        });

        // ===== 重命名 =====
        document.getElementById('renameBtn').addEventListener('click', () => {
            document.getElementById('renamePattern').value = '';
            document.getElementById('renameReplacement').value = '';
            document.getElementById('renamePreview').style.display = 'none';
            document.getElementById('renameConfirmBtn').disabled = true;
            openModal('renameModal');
        });

        document.getElementById('renamePattern').addEventListener('input', previewRename);
        document.getElementById('renameReplacement').addEventListener('input', previewRename);

        async function previewRename() {
            const pattern = document.getElementById('renamePattern').value;
            const replacement = document.getElementById('renameReplacement').value;
            const files = getSelectedPaths();

            if (!pattern || files.length === 0) {
                document.getElementById('renamePreview').style.display = 'none';
                document.getElementById('renameConfirmBtn').disabled = true;
                return;
            }

            try {
                const res = await fetch('/api/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pattern, replacement, files })
                });
                const data = await res.json();

                const list = document.getElementById('renamePreviewList');
                list.innerHTML = '';
                if (data.files && data.files.length > 0) {
                    data.files.forEach(f => {
                        const div = document.createElement('div');
                        div.className = 'changed';
                        div.textContent = `${f.old_name} → ${f.new_name}`;
                        list.appendChild(div);
                    });
                    document.getElementById('renamePreview').style.display = 'block';
                    document.getElementById('renameConfirmBtn').disabled = false;
                } else {
                    list.innerHTML = '<div style="color:#4a4e62;">没有文件需要重命名</div>';
                    document.getElementById('renamePreview').style.display = 'block';
                    document.getElementById('renameConfirmBtn').disabled = true;
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('renameConfirmBtn').addEventListener('click', async () => {
            const pattern = document.getElementById('renamePattern').value;
            const replacement = document.getElementById('renameReplacement').value;
            const files = getSelectedPaths();

            // 先获取预览结果
            const res = await fetch('/api/preview', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pattern, replacement, files })
            });
            const data = await res.json();

            if (!data.files || data.files.length === 0) {
                alert('没有文件需要重命名');
                return;
            }

            closeModal('renameModal');
            clearLog();
            showLog(`⏳ 开始重命名 ${data.files.length} 个文件...`, 'info');

            const result = await executeAction({
                action: 'rename',
                files: data.files,
                pattern,
                replacement
            });

            if (result.logs) {
                result.logs.forEach(log => showLog(log.text, log.type || 'info'));
            }
            if (result.stats) {
                showLog(`✅ ${result.stats.message}`, 'success');
            }

            selectedFiles.clear();
            navigateTo(currentPath);
        });

        // ===== 去重 =====
        document.getElementById('dedupBtn').addEventListener('click', () => {
            openModal('dedupModal');
        });

        document.getElementById('dedupConfirmBtn').addEventListener('click', async () => {
            const action = document.getElementById('dedupAction').value;
            closeModal('dedupModal');
            clearLog();
            showLog(`⏳ 开始去重...`, 'info');

            const result = await executeAction({
                action: 'dedup',
                delete: action === 'delete'
            });

            if (result.logs) {
                result.logs.forEach(log => showLog(log.text, log.type || 'info'));
            }
            if (result.stats) {
                showLog(`✅ ${result.stats.message}`, 'success');
            }
            navigateTo(currentPath);
        });

        // ===== 压缩 =====
        document.getElementById('compressBtn').addEventListener('click', () => {
            openModal('compressModal');
        });

        document.getElementById('compressConfirmBtn').addEventListener('click', async () => {
            const quality = parseInt(document.getElementById('compressQuality').value);
            const format = document.getElementById('compressFormat').value;
            closeModal('compressModal');
            clearLog();
            showLog(`⏳ 开始压缩图片...`, 'info');

            const result = await executeAction({
                action: 'compress',
                quality: quality,
                format: format
            });

            if (result.logs) {
                result.logs.forEach(log => showLog(log.text, log.type || 'info'));
            }
            if (result.stats) {
                showLog(`✅ ${result.stats.message}`, 'success');
            }
            navigateTo(currentPath);
        });

        // ===== 点击模态框外部关闭 =====
        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) {
                    el.classList.remove('show');
                }
            });
        });

        // ===== 初始化 =====
        navigateTo('/');
    </script>
</body>
</html>
