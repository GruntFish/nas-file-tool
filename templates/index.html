<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件工具箱</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .container{width:100%;max-width:1600px;height:95vh;background:#1a1d27;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
        .header{padding:10px 20px;background:#222632;border-bottom:1px solid #2d313e;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
        .header h1{font-size:15px;color:#e4e6eb;display:flex;align-items:center;gap:10px}
        .header h1 span{background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header-actions .badge{color:#8b8fa3;font-size:11px;background:#2d313e;padding:4px 14px;border-radius:20px}
        .main{display:flex;flex:1;overflow:hidden}
        .sidebar{width:280px;min-width:200px;background:#14171f;border-right:1px solid #2d313e;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
        .sidebar-header{padding:8px 14px;background:#1a1d27;border-bottom:1px solid #2d313e;font-size:11px;color:#8b8fa3;text-transform:uppercase;letter-spacing:1px;font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
        .sidebar-header .refresh-btn{background:0;border:0;color:#667eea;cursor:pointer;font-size:14px;padding:2px 8px;border-radius:4px}
        .sidebar-header .refresh-btn:hover{background:#2d313e}
        .tree-container{flex:1;overflow-y:auto;padding:4px 0}
        .tree-container::-webkit-scrollbar{width:4px}
        .tree-container::-webkit-scrollbar-track{background:#14171f}
        .tree-container::-webkit-scrollbar-thumb{background:#2d313e;border-radius:4px}
        .tree-item{display:flex;align-items:center;padding:3px 12px 3px 8px;cursor:pointer;color:#b5b9c9;font-size:13px;border-radius:4px;margin:1px 6px;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
        .tree-item:hover{background:#2d313e;color:#e4e6eb}
        .tree-item.active{background:#2d3b6e;color:#e4e6eb}
        .tree-item .icon{margin-right:6px;font-size:14px;flex-shrink:0;width:20px;text-align:center}
        .tree-item .name{overflow:hidden;text-overflow:ellipsis}
        .tree-item .arrow{margin-left:auto;font-size:11px;color:#6b6f83;transition:transform .2s;flex-shrink:0;cursor:pointer;padding:0 4px}
        .tree-item .arrow.open{transform:rotate(90deg)}
        .tree-children{padding-left:16px;overflow:hidden}
        .tree-children.collapsed{display:none}
        .content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
        .module-menu{display:flex;gap:2px;padding:4px 14px;background:#14171f;border-bottom:1px solid #2d313e;flex-shrink:0;flex-wrap:wrap}
        .module-menu .menu-btn{background:0;border:0;color:#8b8fa3;padding:5px 14px;font-size:12px;cursor:pointer;border-radius:4px;transition:all .15s;font-family:inherit}
        .module-menu .menu-btn:hover{background:#2d313e;color:#e4e6eb}
        .module-menu .menu-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .path-bar{padding:4px 14px;background:#1a1d27;border-bottom:1px solid #2d313e;display:flex;align-items:center;flex-shrink:0;min-height:32px;flex-wrap:wrap;gap:4px}
        .path-bar .path-display{color:#8b8fa3;font-size:12px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .path-bar .path-display strong{color:#e4e6eb}
        .path-bar .path-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
        .path-bar .path-actions input[type="text"]{background:#1a1d27;border:1px solid #2d313e;border-radius:4px;color:#e4e6eb;padding:2px 10px;font-size:12px;height:22px;width:160px;outline:none;font-family:inherit}
        .path-bar .path-actions input[type="text"]:focus{border-color:#667eea}
        .path-bar .path-actions button{background:#2d313e;border:0;color:#b5b9c9;padding:2px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;height:22px}
        .path-bar .path-actions button:hover{background:#3d4150;color:#e4e6eb}
        .path-bar .path-actions #undoBtn{background:#f6ad55;color:#1a1d27}
        .path-bar .path-actions #undoBtn:hover{opacity:0.8}
        .path-bar .path-actions #undoBtn:disabled{opacity:0.4;cursor:not-allowed}
        .module-content{flex:0 0 auto;min-height:30px;background:#14171f;border-bottom:1px solid #2d313e}
        .file-list-container{flex:1;overflow:auto;padding:0}
        .file-list-container::-webkit-scrollbar{width:6px;height:6px}
        .file-list-container::-webkit-scrollbar-track{background:#14171f}
        .file-list-container::-webkit-scrollbar-thumb{background:#2d313e;border-radius:4px}
        .file-table{width:100%;border-collapse:collapse;font-size:13px}
        .file-table thead{position:sticky;top:0;z-index:10}
        .file-table th{text-align:left;padding:5px 10px;color:#8b8fa3;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #2d313e;background:#1a1d27}
        .file-table td{padding:4px 10px;color:#b5b9c9;border-bottom:1px solid #1f222c;font-size:12px}
        .file-table tr:hover td{background:#222632}
        .file-table tr.selected td{background:#2d3b6e}
        .file-table .checkbox-col{width:28px;text-align:center}
        .file-table .checkbox-col input[type=checkbox]{accent-color:#667eea;width:14px;height:14px;cursor:pointer}
        .file-table .name-col{font-weight:500}
        .file-table .new-name-col{color:#68d391;font-weight:500}
        .file-table .new-name-col.unchanged{color:#4a4e62;font-weight:400}
        .file-table .size-col{color:#6b6f83;font-size:11px}
        .file-table .date-col{color:#6b6f83;font-size:11px}
        .file-table .status-col{font-size:11px}
        .file-table .status-col.changed{color:#f0c94d}
        .file-table .status-col.ok{color:#68d391}
        .file-table .folder-row .name-col{color:#f0c94d}
        .file-table .empty-row td{padding:40px;text-align:center;color:#4a4e62;font-size:14px}
        .status-bar{padding:3px 16px;background:#14171f;border-top:1px solid #2d313e;display:flex;justify-content:space-between;font-size:11px;color:#4a4e62;flex-shrink:0}
        .log-area{max-height:60px;overflow-y:auto;background:#14171f;border-top:1px solid #2d313e;padding:3px 16px;font-family:'Courier New',monospace;font-size:11px;line-height:1.4;display:none;flex-shrink:0}
        .log-area.show{display:block}
        .log-area .log-line{color:#8b8fa3;padding:1px 0}
        .log-area .log-line.success{color:#68d391}
        .log-area .log-line.error{color:#fc8181}
        .log-area .log-line.warning{color:#f6ad55}
        .log-area .log-line.info{color:#63b3ed}
        .log-area::-webkit-scrollbar{width:4px}
        .log-area::-webkit-scrollbar-track{background:#14171f}
        .log-area::-webkit-scrollbar-thumb{background:#2d313e;border-radius:4px}
        .loading-spinner{display:inline-block;width:14px;height:14px;border:2px solid #2d313e;border-top:2px solid #667eea;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
        @keyframes spin{to{transform:rotate(360deg)}

        /* ===== 模块通用样式 ===== */
        .module-rename,.module-move-copy,.module-dedup,.module-delete,.module-classify,.module-chmod,.module-media,.module-scheduler{padding:6px 14px;background:#14171f;border-bottom:1px solid #2d313e;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;min-height:34px}

        /* ===== 重命名模块下拉框强制样式 ===== */
        .module-rename select,
        .module-rename input,
        .module-rename button {
            background: #1a1d27 !important;
            border: 1px solid #2d313e;
            border-radius: 4px;
            color: #e4e6eb !important;
            padding: 3px 8px;
            font-size: 12px;
            height: 28px;
            font-family: inherit;
            outline: 0;
            -webkit-appearance: auto;
            appearance: auto;
        }
        .module-rename select option {
            background: #1a1d27 !important;
            color: #e4e6eb !important;
        }
        .module-rename select:disabled,
        .module-rename select.disabled {
            opacity: 0.7;
            cursor: not-allowed;
            color: #8b8fa3 !important;
        }
        .module-rename select:focus,
        .module-rename input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.3);
        }
        .module-rename select:-moz-focusring {
            color: #e4e6eb !important;
            text-shadow: 0 0 0 #e4e6eb;
        }
        .module-rename select::-ms-expand {
            background: #1a1d27;
            color: #e4e6eb;
        }

        /* ===== 执行重命名按钮样式 ===== */
        .module-rename .btn-execute {
            background: linear-gradient(135deg, #667eea, #764ba2) !important;
            border: none !important;
            color: #fff !important;
            padding: 4px 18px !important;
            border-radius: 6px !important;
            font-size: 13px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            font-family: inherit !important;
            height: 30px !important;
            min-width: 100px !important;
            transition: all 0.15s ease !important;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3) !important;
        }
        .module-rename .btn-execute:hover {
            opacity: 0.85 !important;
            transform: translateY(-1px) !important;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4) !important;
        }
        .module-rename .btn-execute:active {
            transform: translateY(0px) !important;
            box-shadow: 0 1px 4px rgba(102, 126, 234, 0.2) !important;
        }
        .module-rename .btn-execute:disabled {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
            transform: none !important;
        }

        .module-rename .label{color:#8b8fa3;font-size:11px;font-weight:600;white-space:nowrap}
        .module-rename .checkbox-label{color:#8b8fa3;font-size:11px;display:flex;align-items:center;gap:4px}
        .module-rename .checkbox-label input[type=checkbox]{accent-color:#667eea;margin:0;width:12px;height:12px}
        .module-rename #numParams,
        .module-rename #extParams,
        .module-rename #removePosParams,
        .module-rename #dateParams{display:none;align-items:center;gap:4px;flex-wrap:wrap}
        .module-rename #numParams input,
        .module-rename #extParams input,
        .module-rename #removePosParams input{width:45px}
        .module-rename #extParams input{width:60px}

        /* ===== 其他模块按钮 ===== */
        .module-dedup button,.module-delete button,.module-classify button,.module-chmod button,.module-media button,.module-scheduler button,.module-move-copy button{background:linear-gradient(135deg,#667eea,#764ba2);border:0;color:#fff;padding:3px 16px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;height:28px;font-family:inherit}
        .module-dedup button:hover,.module-delete button:hover,.module-classify button:hover,.module-chmod button:hover,.module-media button:hover,.module-scheduler button:hover,.module-move-copy button:hover{opacity:.85}
        .module-delete button{background:#e53e3e}
        .module-scheduler #schedulerList{padding:8px 0;flex:1;overflow-y:auto}

        /* ===== 模态框样式 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
        }
        .modal-overlay.show {
            display: flex !important;
        }
        .modal {
            background: #1a1d27;
            border-radius: 12px;
            padding: 24px;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #2d313e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            margin: auto;
        }
        .modal h2{color:#e4e6eb;font-size:17px;margin-bottom:12px}
        .modal h3{color:#8b8fa3;font-size:13px;margin:10px 0 6px}
        .modal hr{border:0;border-top:1px solid #2d313e;margin:10px 0}
        .modal .form-group{margin-bottom:8px}
        .modal .form-group label{display:block;color:#8b8fa3;font-size:12px;font-weight:600;margin-bottom:2px}
        .modal .form-group select,.modal .form-group input{width:100%;padding:5px 8px;background:#14171f;border:1px solid #2d313e;border-radius:6px;color:#e4e6eb;font-size:13px;outline:0;font-family:inherit}
        .modal .form-group select:focus,.modal .form-group input:focus{border-color:#667eea}
        .modal .form-group input[type=checkbox]{width:auto;accent-color:#667eea}
        .modal .filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
        .modal .filter-grid .form-group{margin-bottom:0}
        .modal .filter-grid .form-group label{font-size:11px}
        .modal .filter-grid .form-group select,.modal .filter-grid .form-group input{padding:4px 6px;font-size:12px}
        .modal .filter-grid .full-width{grid-column:1 / -1}
        .modal .btn-row{display:flex;gap:10px;margin-top:14px}
        .modal .btn-row button{flex:1;padding:8px;border:0;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
        .modal .btn-row .btn-confirm{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .modal .btn-row .btn-confirm:hover{opacity:.85}
        .modal .btn-row .btn-cancel{background:#2d313e;color:#b5b9c9}
        .modal .btn-row .btn-cancel:hover{background:#3d4150}
        .modal .preview-info{background:#14171f;border-radius:6px;padding:6px 10px;margin:4px 0;font-size:12px;color:#b5b9c9}
        .modal .preview-info .matched{color:#68d391}
        .modal .preview-info .total{color:#8b8fa3}
        .modal .preview-list{max-height:120px;overflow-y:auto;background:#14171f;border-radius:6px;padding:4px 8px;margin:4px 0;font-size:12px;font-family:monospace;color:#b5b9c9}
        .modal .preview-list .changed{color:#68d391}
        .modal .warning-box{color:#f6ad55;font-size:12px;margin-bottom:6px;padding:4px 8px;background:#1f1a1a;border-radius:4px;border:1px solid #3d2d1a}
        .modal .warning-box input[type=checkbox]{accent-color:#f6ad55;margin-right:4px}
        .modal .warning-box .sub{color:#8b8fa3;font-size:10px;margin-top:2px;padding-left:20px}

        @media(max-width:768px){.sidebar{width:180px;min-width:120px}.container{height:98vh;border-radius:0}.file-table{font-size:11px}.file-table th,.file-table td{padding:4px 6px}.modal{max-width:95%;padding:16px}.modal .filter-grid{grid-template-columns:1fr}}
        @media(max-width:500px){.sidebar{display:none}.file-table .date-col{display:none}.file-table .size-col{display:none}.modal .filter-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📂 <span>文件工具箱</span></h1>
            <div class="header-actions"><span class="badge">🔄 本地处理 · 隐私安全</span></div>
        </div>

        <div class="main">
            <div class="sidebar">
                <div class="sidebar-header">
                    📁 目录树
                    <button class="refresh-btn" id="refreshTreeBtn">⟳</button>
                </div>
                <div class="tree-container" id="treeContainer">
                    <div style="padding:20px;text-align:center;color:#4a4e62;font-size:13px;">
                        <span class="loading-spinner"></span> 加载中...
                    </div>
                </div>
            </div>

            <div class="content">
                <div class="module-menu" id="moduleMenu">
                    <button class="menu-btn active" data-module="rename">✏️ 重命名</button>
                    <button class="menu-btn" data-module="move_copy">📦 移动/复制</button>
                    <button class="menu-btn" data-module="dedup">🧹 去重</button>
                    <button class="menu-btn" data-module="delete">🗑️ 删除</button>
                    <button class="menu-btn" data-module="classify">📂 分类整理</button>
                    <button class="menu-btn" data-module="chmod">🔒 权限</button>
                    <button class="menu-btn" data-module="media">🎬 媒体处理</button>
                    <button class="menu-btn" data-module="scheduler">⏰ 定时任务</button>
                </div>

                <div class="path-bar">
                    <div class="path-display">
                        📂 <strong id="currentPathDisplay">/</strong>
                        <span id="fileCountDisplay" style="margin-left:12px;color:#4a4e62;">0 项</span>
                        <span id="selectedInfo" style="margin-left:12px;color:#667eea;"></span>
                    </div>
                    <div class="path-actions">
                        <input type="text" id="filterInput" placeholder="🔍 正则过滤 如: \.jpg$">
                        <span id="filterCount" style="color:#4a4e62;font-size:11px;"></span>
                        <button id="selectAllBtn">全选</button>
                        <button id="clearAllBtn">取消</button>
                        <button id="undoBtn" disabled>↩ 撤销</button>
                    </div>
                </div>

                <div class="module-content" id="moduleContent"></div>

                <div class="file-list-container" id="fileListContainer">
                    <table class="file-table">
                        <thead>
                            <tr>
                                <th class="checkbox-col"><input type="checkbox" id="selectAll"></th>
                                <th class="name-col">名称</th>
                                <th class="new-name-col">新名称</th>
                                <th class="size-col">大小</th>
                                <th class="date-col">修改时间</th>
                                <th class="status-col">状态</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody">
                            <tr class="empty-row"><td colspan="6">📭 此目录为空</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="log-area" id="logArea"></div>
            </div>
        </div>

        <div class="status-bar">
            <span id="statusLeft">就绪</span>
            <span id="statusRight">ghcr.io/gruntfish/nas-file-tool</span>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/virtual_scroll.js"></script>
    <script src="/static/js/progress.js"></script>
    <script src="/static/js/modules/rename.js"></script>
    <script src="/static/js/modules/move_copy.js"></script>
    <script src="/static/js/modules/dedup.js"></script>
    <script src="/static/js/modules/delete.js"></script>
    <script src="/static/js/modules/classify.js"></script>
    <script src="/static/js/modules/chmod.js"></script>
    <script src="/static/js/modules/media.js"></script>
    <script src="/static/js/modules/scheduler.js"></script>
</body>
</html>
