name: 构建 Docker 镜像

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

jobs:
  create-tag:
    name: 创建 Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 创建 Tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $TAG
          git push origin $TAG
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build-docker:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: create-tag
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置镜像名称（转小写）
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ needs.create-tag.outputs.tag }}-${{ matrix.arch }}
            ghcr.io/${{ env.REPO_LOWER }}:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 合并多架构镜像
        run: |
          docker manifest create ghcr.io/${{ env.REPO_LOWER }}:latest \
            ghcr.io/${{ env.REPO_LOWER }}:latest-amd64 \
            ghcr.io/${{ env.REPO_LOWER }}:latest-arm64
          docker manifest push ghcr.io/${{ env.REPO_LOWER }}:latest

          docker manifest create ghcr.io/${{ env.REPO_LOWER }}:${{ needs.create-tag.outputs.tag }} \
            ghcr.io/${{ env.REPO_LOWER }}:${{ needs.create-tag.outputs.tag }}-amd64 \
            ghcr.io/${{ env.REPO_LOWER }}:${{ needs.create-tag.outputs.tag }}-arm64
          docker manifest push ghcr.io/${{ env.REPO_LOWER }}:${{ needs.create-tag.outputs.tag }}

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          name: Release ${{ needs.create-tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
