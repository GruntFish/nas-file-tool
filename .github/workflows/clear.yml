name: 清理 Actions 编译记录（保留最新3个）

on:
  workflow_run:
    workflows:
      - "构建 Docker 镜像和 FPK 包"
    types:
      - completed

jobs:
  cleanup:
    name: 清理运行记录
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: 删除旧记录（保留最新3个）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          import os
          import requests
          import time
          import json

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPO']

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github.v3+json'
          }

          # 获取所有运行记录
          url = f'https://api.github.com/repos/{repo}/actions/runs'
          params = {'per_page': 100, 'page': 1}
          all_runs = []

          while True:
              response = requests.get(url, headers=headers, params=params)
              if response.status_code != 200:
                  print(f'❌ 获取失败: {response.status_code}')
                  print(f'返回内容: {response.text}')
                  break
              data = response.json()
              if not data:
                  break
              # 确保是列表
              if isinstance(data, list):
                  all_runs.extend(data)
              else:
                  print(f'⚠️ 返回数据不是列表: {type(data)}')
                  break
              params['page'] += 1

          total = len(all_runs)
          print(f'📊 共 {total} 条运行记录')

          if total <= 3:
              print('✅ 只有 3 条或更少，无需清理')
              exit(0)

          # 只保留有效的记录（必须有 created_at 字段）
          valid_runs = [r for r in all_runs if isinstance(r, dict) and 'created_at' in r]
          print(f'📊 有效记录: {len(valid_runs)} 条')

          if len(valid_runs) <= 3:
              print('✅ 有效记录只有 3 条或更少，无需清理')
              exit(0)

          # 按创建时间排序，保留最新3个
          valid_runs.sort(key=lambda x: x['created_at'], reverse=True)
          to_delete = valid_runs[3:]

          print(f'📊 将删除 {len(to_delete)} 条记录')

          deleted = 0
          for run in to_delete:
              run_id = run.get('id')
              if not run_id:
                  continue
              title = run.get('display_title', 'unknown')
              created = run.get('created_at', 'unknown')[:10] if run.get('created_at') else 'unknown'

              # 跳过运行中的
              if run.get('status') in ['queued', 'in_progress', 'pending']:
                  print(f'⏳ 跳过运行中: #{run_id}')
                  continue

              delete_url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
              res = requests.delete(delete_url, headers=headers)

              if res.status_code == 204:
                  print(f'✅ 已删除: #{run_id} - {title} ({created})')
                  deleted += 1
              else:
                  print(f'❌ 删除失败: #{run_id} - {res.status_code}')
              time.sleep(0.3)

          print(f'✅ 完成！共删除 {deleted} 条，保留最新 3 条')
        shell: python
