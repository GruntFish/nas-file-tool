name: 清理 Actions 编译记录（保留最新3个）

on:
  workflow_dispatch:

jobs:
  cleanup:
    name: 清理运行记录
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: 删除旧记录（保留最新3个）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          import os
          import requests
          import time

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPO']

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github.v3+json'
          }

          # 获取所有运行记录
          url = f'https://api.github.com/repos/{repo}/actions/runs'
          params = {'per_page': 100, 'page': 1}
          all_runs = []

          while True:
              response = requests.get(url, headers=headers, params=params)
              if response.status_code != 200:
                  print(f'❌ 获取失败: {response.status_code}')
                  break
              data = response.json()
              # GitHub API 返回的是 dict，workflow_runs 才是列表
              if isinstance(data, dict):
                  runs = data.get('workflow_runs', [])
                  if not runs:
                      break
                  all_runs.extend(runs)
              else:
                  print(f'⚠️ 未知返回格式: {type(data)}')
                  break
              params['page'] += 1

          total = len(all_runs)
          print(f'📊 共 {total} 条运行记录')

          if total <= 3:
              print('✅ 只有 3 条或更少，无需清理')
              exit(0)

          # 按创建时间排序，保留最新3个
          all_runs.sort(key=lambda x: x.get('created_at', ''), reverse=True)
          to_delete = all_runs[3:]

          deleted = 0
          for run in to_delete:
              run_id = run.get('id')
              if not run_id:
                  continue
              title = run.get('display_title', 'unknown')
              created = run.get('created_at', 'unknown')
              if created != 'unknown':
                  created = created[:10]

              # 跳过运行中的
              if run.get('status') in ['queued', 'in_progress', 'pending']:
                  print(f'⏳ 跳过运行中: #{run_id}')
                  continue

              delete_url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
              res = requests.delete(delete_url, headers=headers)

              if res.status_code == 204:
                  print(f'✅ 已删除: #{run_id} - {title} ({created})')
                  deleted += 1
              else:
                  print(f'❌ 删除失败: #{run_id} - {res.status_code}')
              time.sleep(0.3)

          print(f'✅ 完成！共删除 {deleted} 条，保留最新 3 条')
        shell: python
