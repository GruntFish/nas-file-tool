<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ 极简文件工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
            border-left: 3px solid #667eea;
            padding-left: 14px;
        }

        .tool-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        .tool-card {
            background: #f7fafc;
            border-radius: 14px;
            padding: 18px 22px;
            border: 2px solid transparent;
            transition: all 0.25s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .tool-card:hover {
            border-color: #667eea;
            background: #edf2f7;
            transform: translateX(4px);
        }
        .tool-card.active {
            border-color: #667eea;
            background: #eef2ff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .tool-icon {
            font-size: 28px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 12px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .tool-info {
            flex: 1;
        }
        .tool-info h3 {
            font-size: 16px;
            color: #2d3748;
            font-weight: 600;
        }
        .tool-info p {
            font-size: 13px;
            color: #718096;
            margin-top: 2px;
        }
        .tool-badge {
            font-size: 12px;
            background: #667eea;
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .form-area {
            background: #f7fafc;
            border-radius: 14px;
            padding: 22px;
            margin-top: 10px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        .form-area.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: border 0.2s;
            background: white;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-hint {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 4px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(72, 187, 120, 0.35);
        }
        .btn-success:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn:active {
            transform: translateY(0) !important;
        }

        .preview-area {
            margin-top: 20px;
            display: none;
            animation: slideDown 0.4s ease-out;
        }
        .preview-area.show {
            display: block;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .preview-header h3 {
            font-size: 16px;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .preview-count {
            font-size: 13px;
            color: #718096;
            background: #edf2f7;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .preview-table-wrap {
            max-height: 320px;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: white;
        }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .preview-table thead {
            background: #f7fafc;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .preview-table th {
            padding: 10px 16px;
            text-align: left;
            font-weight: 600;
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .preview-table td {
            padding: 9px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #2d3748;
        }
        .preview-table tr:last-child td {
            border-bottom: none;
        }
        .preview-table tr:hover td {
            background: #f7fafc;
        }

        .preview-table .old-name {
            color: #718096;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .preview-table .arrow {
            color: #a0aec0;
            padding: 0 8px;
            font-size: 18px;
        }
        .preview-table .new-name {
            color: #48bb78;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .preview-table .unchanged {
            color: #a0aec0;
            font-style: italic;
        }
        .preview-table .index-col {
            color: #a0aec0;
            font-size: 12px;
            width: 40px;
            text-align: center;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .log-area {
            margin-top: 20px;
            background: #1a202c;
            border-radius: 12px;
            padding: 16px 20px;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .log-area.show {
            display: block;
        }
        .log-area .log-line {
            color: #a0aec0;
            padding: 2px 0;
            border-bottom: 1px solid #2d3748;
        }
        .log-area .log-line.success {
            color: #68d391;
        }
        .log-area .log-line.error {
            color: #fc8181;
        }
        .log-area .log-line.info {
            color: #63b3ed;
        }

        .log-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            font-size: 13px;
            color: #4a5568;
        }
        .log-stats span {
            font-weight: 600;
            color: #2d3748;
        }

        .preview-table-wrap::-webkit-scrollbar,
        .log-area::-webkit-scrollbar {
            width: 6px;
        }
        .preview-table-wrap::-webkit-scrollbar-track,
        .log-area::-webkit-scrollbar-track {
            background: #f7fafc;
            border-radius: 10px;
        }
        .preview-table-wrap::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        .log-area::-webkit-scrollbar-track {
            background: #2d3748;
        }

        @media (max-width: 650px) {
            .container {
                padding: 24px 18px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .btn-group {
                flex-direction: column;
            }
            .tool-card {
                padding: 14px 16px;
            }
            .tool-icon {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            h1 {
                font-size: 22px;
            }
            .preview-table {
                font-size: 12px;
            }
            .preview-table td,
            .preview-table th {
                padding: 7px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            <span>🛠️ 文件工具箱</span>
        </h1>
        <div class="subtitle">📂 批量重命名 · 去重 · 图片压缩 — 所有处理在本地完成</div>

        <div class="tool-grid">
            <div class="tool-card active" data-tool="rename">
                <div class="tool-icon">✏️</div>
                <div class="tool-info">
                    <h3>批量重命名</h3>
                    <p>正则替换文件名（预览后确认）</p>
                </div>
                <span class="tool-badge">预览</span>
            </div>

            <div class="tool-card" data-tool="dedup">
                <div class="tool-icon">🧹</div>
                <div class="tool-info">
                    <h3>文件去重</h3>
                    <p>基于 MD5 查找并删除重复</p>
                </div>
                <span class="tool-badge">哈希</span>
            </div>

            <div class="tool-card" data-tool="compress">
                <div class="tool-icon">🗜️</div>
                <div class="tool-info">
                    <h3>图片压缩</h3>
                    <p>JPEG / PNG 智能压缩</p>
                </div>
                <span class="tool-badge">图像</span>
            </div>
        </div>

        <div class="form-area show" id="formArea"></div>

        <div class="btn-group">
            <button class="btn btn-primary" id="previewBtn">👁️ 预览</button>
            <button class="btn btn-success" id="executeBtn" disabled>✅ 确认执行</button>
        </div>

        <div class="preview-area" id="previewArea">
            <div class="preview-header">
                <h3>📋 重命名预览</h3>
                <span class="preview-count" id="previewCount">0 个文件</span>
            </div>
            <div class="preview-table-wrap">
                <table class="preview-table" id="previewTable">
                    <thead>
                        <tr>
                            <th class="index-col">#</th>
                            <th>当前文件名</th>
                            <th style="width:40px;text-align:center;">→</th>
                            <th>新文件名</th>
                            <th style="width:80px;text-align:center;">状态</th>
                        </tr>
                    </thead>
                    <tbody id="previewBody"></tbody>
                </table>
            </div>
        </div>

        <div class="log-area" id="logArea">
            <div class="log-line info">⏳ 等待执行...</div>
        </div>
    </div>

    <script>
        const TOOLS = {
            rename: {
                label: '批量重命名',
                fields: [
                    { name: 'pattern', label: '🔍 匹配模式', type: 'text', placeholder: '例如: IMG_', hint: '要替换的字符串（支持正则）' },
                    { name: 'replacement', label: '🔄 替换为', type: 'text', placeholder: '例如: photo_', hint: '替换后的新内容' }
                ]
            },
            dedup: {
                label: '文件去重',
                fields: [
                    { name: 'action', label: '⚙️ 操作', type: 'select', options: ['仅查找', '删除重复'] }
                ]
            },
            compress: {
                label: '图片压缩',
                fields: [
                    { name: 'quality', label: '📊 压缩质量', type: 'select', options: ['70 (高压缩)', '80 (推荐)', '90 (高质量)'] },
                    { name: 'format', label: '📁 输出格式', type: 'select', options: ['保持原格式', '统一为 WebP', '统一为 JPEG'] }
                ]
            }
        };

        const cards = document.querySelectorAll('.tool-card');
        const formArea = document.getElementById('formArea');
        const previewBtn = document.getElementById('previewBtn');
        const executeBtn = document.getElementById('executeBtn');
        const previewArea = document.getElementById('previewArea');
        const previewBody = document.getElementById('previewBody');
        const previewCount = document.getElementById('previewCount');
        const logArea = document.getElementById('logArea');

        let currentTool = 'rename';
        let previewData = [];

        function switchTool(toolId) {
            currentTool = toolId;
            cards.forEach(c => c.classList.toggle('active', c.dataset.tool === toolId));
            renderForm(toolId);
            hidePreview();
            hideLog();
            executeBtn.disabled = true;
        }

        function renderForm(toolId) {
            const tool = TOOLS[toolId];
            let html = '';

            tool.fields.forEach(field => {
                if (field.type === 'select') {
                    html += `
                        <div class="form-group">
                            <label>${field.label}</label>
                            <select name="${field.name}">
                                ${field.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                            </select>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="form-group">
                            <label>${field.label}</label>
                            <input type="text" name="${field.name}" placeholder="${field.placeholder || ''}">
                            ${field.hint ? `<div class="form-hint">💡 ${field.hint}</div>` : ''}
                        </div>
                    `;
                }
            });

            formArea.innerHTML = html;
            formArea.classList.add('show');
        }

        function showPreview() {
            previewArea.classList.add('show');
        }

        function hidePreview() {
            previewArea.classList.remove('show');
        }

        function showLog() {
            logArea.classList.add('show');
        }

        function hideLog() {
            logArea.classList.remove('show');
        }

        function renderPreview(files) {
            previewData = files;
            const tbody = previewBody;
            tbody.innerHTML = '';

            if (!files || files.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align:center;padding:30px;color:#a0aec0;">
                            📭 没有文件需要重命名
                        </td>
                    </tr>
                `;
                previewCount.textContent = '0 个文件';
                return;
            }

            let changedCount = 0;
            files.forEach((file, index) => {
                const isChanged = file.old_name !== file.new_name;
                if (isChanged) changedCount++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="index-col">${index + 1}</td>
                    <td class="old-name">${escapeHtml(file.old_name)}</td>
                    <td style="text-align:center;color:#a0aec0;">→</td>
                    <td class="${isChanged ? 'new-name' : 'unchanged'}">${escapeHtml(file.new_name)}</td>
                    <td style="text-align:center;">
                        ${isChanged ? '🔄 将修改' : '✅ 不变'}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            previewCount.textContent = `${files.length} 个文件 (${changedCount} 个将修改)`;
            executeBtn.disabled = (changedCount === 0);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        previewBtn.addEventListener('click', async () => {
            const tool = currentTool;

            if (tool !== 'rename') {
                await executeAction();
                return;
            }

            const formData = new FormData(formArea);
            const data = Object.fromEntries(formData.entries());

            if (!data.pattern) {
                alert('⚠️ 请输入匹配模式');
                return;
            }

            previewBtn.disabled = true;
            previewBtn.innerHTML = '<span class="loading-spinner"></span> 预览中...';
            executeBtn.disabled = true;

            try {
                const response = await fetch('/api/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pattern: data.pattern,
                        replacement: data.replacement || ''
                    })
                });

                const result = await response.json();

                if (result.error) {
                    alert('❌ ' + result.error);
                    return;
                }

                renderPreview(result.files || []);
                showPreview();
                hideLog();

            } catch (err) {
                alert('❌ 预览失败: ' + err.message);
            } finally {
                previewBtn.disabled = false;
                previewBtn.innerHTML = '👁️ 预览';
            }
        });

        async function executeAction() {
            const tool = currentTool;
            const formData = new FormData(formArea);
            const data = Object.fromEntries(formData.entries());

            let params = { tool };

            if (tool === 'rename') {
                if (previewData.length === 0) {
                    alert('⚠️ 请先点击"预览"查看变更');
                    return;
                }
                params.files = previewData.filter(f => f.old_name !== f.new_name);
                if (params.files.length === 0) {
                    alert('✅ 没有文件需要修改');
                    return;
                }
                const formEntries = Object.fromEntries(formData.entries());
                params.pattern = formEntries.pattern;
                params.replacement = formEntries.replacement;

            } else if (tool === 'dedup') {
                params.delete = data.action === '删除重复';
            } else if (tool === 'compress') {
                const qualityMap = {
                    '70 (高压缩)': 70,
                    '80 (推荐)': 80,
                    '90 (高质量)': 90
                };
                params.quality = qualityMap[data.quality] || 80;
                params.format = data.format === '保持原格式' ? 'original' : data.format.replace('统一为 ', '').toLowerCase();
            }

            previewBtn.disabled = true;
            executeBtn.disabled = true;
            executeBtn.textContent = '⏳ 执行中...';

            showLog();
            logArea.innerHTML = '<div class="log-line info">⏳ 正在处理，请稍候...</div>';

            try {
                const response = await fetch('/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });

                const result = await response.json();

                logArea.innerHTML = '';
                if (result.logs && result.logs.length > 0) {
                    result.logs.forEach(line => {
                        const div = document.createElement('div');
                        div.className = `log-line ${line.type || ''}`;
                        div.textContent = line.text;
                        logArea.appendChild(div);
                    });
                } else {
                    logArea.innerHTML = '<div class="log-line info">✅ 操作完成，无日志输出</div>';
                }

                if (result.stats) {
                    const statsDiv = document.createElement('div');
                    statsDiv.className = 'log-stats';
                    statsDiv.innerHTML = `
                        <span>📊 处理文件: <span>${result.stats.processed || 0}</span></span>
                        <span>📈 操作结果: <span>${result.stats.message || '成功'}</span></span>
                    `;
                    logArea.appendChild(statsDiv);
                }

                if (tool === 'rename') {
                    hidePreview();
                    previewData = [];
                }

            } catch (err) {
                logArea.innerHTML = `<div class="log-line error">❌ 请求失败: ${err.message}</div>`;
            } finally {
                previewBtn.disabled = false;
                previewBtn.innerHTML = '👁️ 预览';
                executeBtn.disabled = false;
                executeBtn.textContent = '✅ 确认执行';
            }
        }

        executeBtn.addEventListener('click', executeAction);

        cards.forEach(card => {
            card.addEventListener('click', () => {
                switchTool(card.dataset.tool);
                hidePreview();
                hideLog();
                previewData = [];
                executeBtn.disabled = true;
            });
        });

        switchTool('rename');
    </script>
</body>
</html>
