name: 打包 FPK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

jobs:
  build-fpk:
    name: 打包 FPK 应用
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 fnpack
        run: |
          wget -q -O fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/
          fnpack --help

      - name: 创建 FPK 项目
        run: |
          fnpack create nas-file-tool --template docker

      - name: 配置 docker-compose
        run: |
          cat > nas-file-tool/app/docker/docker-compose.yaml << 'EOF'
          version: '3.8'
          services:
            file-tool:
              image: ghcr.io/${{ github.repository_owner }}/nas-file-tool:latest
              container_name: file-tool
              ports:
                - "8658:8658"
              volumes:
                - "{{.data_dir}}:/data"
              restart: unless-stopped
              mem_limit: 512m
          EOF

      - name: 配置桌面 UI
        run: |
          mkdir -p nas-file-tool/app/ui
          cat > nas-file-tool/app/ui/config << 'EOF'
          {
            "name": "文件工具箱",
            "icon": "icon.png",
            "url": "http://localhost:8658",
            "type": "web"
          }
          EOF

      - name: 转换 favicon 为桌面图标
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert favicon.ico[0] -resize 64x64 nas-file-tool/ICON.PNG
          convert favicon.ico[0] -resize 256x256 nas-file-tool/ICON_256.PNG
          cp nas-file-tool/ICON.PNG nas-file-tool/app/ui/icon.png

      - name: 配置 manifest
        run: |
          cat > nas-file-tool/manifest << EOF
          app_name: nas-file-tool
          version: ${{ github.event.inputs.version }}
          description: 文件工具箱 - 批量重命名/去重/压缩/分类整理
          arch: amd64,arm64
          developer: ${{ github.repository_owner }}
          homepage: https://github.com/${{ github.repository }}
          type: docker
          desktop_uidir: ui
          ports: 8658:8658
          volumes: /vol1/1000/:/data
          services: docker
          configurable: true
          EOF

      - name: 配置 privilege
        run: |
          cat > nas-file-tool/config/privilege << 'EOF'
          {
            "docker": true,
            "network": true,
            "storage": true
          }
          EOF

      - name: 配置资源声明
        run: |
          cat > nas-file-tool/config/resource << 'EOF'
          {
            "config": {
              "data_dir": {
                "type": "string",
                "title": "工作目录",
                "description": "选择文件工具箱的工作目录",
                "default": "/vol1/1000/",
                "format": "directory"
              }
            }
          }
          EOF

      - name: 创建安装向导
        run: |
          mkdir -p nas-file-tool/wizard
          cat > nas-file-tool/wizard/install << 'EOF'
          {
            "pages": [
              {
                "title": "选择工作目录",
                "description": "请选择文件工具箱要管理的目录",
                "fields": [
                  {
                    "name": "data_dir",
                    "label": "工作目录",
                    "type": "directory",
                    "required": true,
                    "default": "/vol1/1000/"
                  }
                ]
              }
            ]
          }
          EOF

      - name: 配置生命周期脚本
        run: |
          cat > nas-file-tool/cmd/main << 'EOF'
          #!/bin/sh
          . "$TRIM_APPDEST/config/env"

          case "$1" in
            start)
              cd "$TRIM_APPDEST/app/docker"
              export data_dir="$data_dir"
              docker compose up -d
              ;;
            stop)
              cd "$TRIM_APPDEST/app/docker"
              docker compose down
              ;;
            status)
              if docker ps --format '{{.Names}}' | grep -q "^file-tool$"; then
                exit 0
              else
                exit 3
              fi
              ;;
            config_init)
              echo "data_dir=$data_dir" > "$TRIM_APPDEST/config/env"
              ;;
            config_callback)
              cd "$TRIM_APPDEST/app/docker"
              docker compose down
              export data_dir="$data_dir"
              docker compose up -d
              ;;
            *)
              echo "Usage: $0 {start|stop|status|config_init|config_callback}"
              exit 1
              ;;
          esac
          exit 0
          EOF
          chmod +x nas-file-tool/cmd/main

      - name: 打包 FPK
        run: |
          cd nas-file-tool
          fnpack build
          mv nas-file-tool.fpk ../
          cd ..

      - name: 上传 FPK
        uses: actions/upload-artifact@v4
        with:
          name: nas-file-tool
          path: nas-file-tool.fpk

      - name: 发布 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: nas-file-tool.fpk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
