name: 打包 FPK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.1.0)'
        required: true
        default: 'v1.1.0'
        type: string

jobs:
  build-fpk:
    name: 打包 FPK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 fnpack
        run: |
          wget -q -O fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/

      - name: 创建项目
        run: fnpack create nas-file-tool --template docker

      - name: 写入 docker-compose.yaml
        run: |
          cat > nas-file-tool/app/docker/docker-compose.yaml << 'EOF'
          version: '3.8'
          services:
            file-tool:
              image: ghcr.io/${{ github.repository_owner }}/nas-file-tool:latest
              container_name: file-tool
              ports:
                - "8658:8658"
              volumes:
                - "{{.data_dir}}:/data"
              restart: unless-stopped
          EOF

      - name: 写入 manifest
        run: |
          cat > nas-file-tool/manifest << EOF
          appname: nas-file-tool
          display_name: 文件工具箱
          version: ${{ github.event.inputs.version }}
          description: 文件工具箱
          arch: amd64
          developer: ${{ github.repository_owner }}
          source: app/docker/docker-compose.yaml
          type: docker
          desktop_uidir: ui
          ports: 8658:8658
          volumes: /vol1/1000/:/data
          services: docker
          configurable: true
          EOF

      - name: 写入 privilege
        run: |
          cat > nas-file-tool/config/privilege << 'EOF'
          {"docker":true,"network":true,"storage":true}
          EOF

      - name: 创建资源声明
        run: |
          cat > nas-file-tool/config/resource << 'EOF'
          {"config":{"data_dir":{"type":"string","title":"工作目录","default":"/vol1/1000/","format":"directory"}}}
          EOF

      - name: 创建安装向导
        run: |
          mkdir -p nas-file-tool/wizard
          cat > nas-file-tool/wizard/install << 'EOF'
          {"pages":[{"title":"选择工作目录","fields":[{"name":"data_dir","label":"工作目录","type":"directory","required":true,"default":"/vol1/1000/"}]}]}
          EOF

      - name: 写入启动脚本
        run: |
          cat > nas-file-tool/cmd/main << 'EOF'
          #!/bin/sh
          . "$TRIM_APPDEST/config/env"
          case "$1" in
            start)
              cd "$TRIM_APPDEST/app/docker"
              export data_dir="$data_dir"
              docker compose up -d
              ;;
            stop)
              cd "$TRIM_APPDEST/app/docker"
              docker compose down
              ;;
            status)
              if docker ps | grep -q file-tool; then exit 0; else exit 3; fi
              ;;
            config_init)
              echo "data_dir=$data_dir" > "$TRIM_APPDEST/config/env"
              ;;
            config_callback)
              cd "$TRIM_APPDEST/app/docker"
              docker compose down
              export data_dir="$data_dir"
              docker compose up -d
              ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x nas-file-tool/cmd/main

      - name: 复制图标
        run: |
          cp favicon.ico nas-file-tool/ICON.PNG
          cp favicon.ico nas-file-tool/ICON_256.PNG

      - name: 打包
        run: |
          cd nas-file-tool
          fnpack build
          mv nas-file-tool.fpk ../

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: nas-file-tool
          path: nas-file-tool.fpk

      - name: 发布 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: nas-file-tool.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
